  const isSessionPast = (s) => {
    if (!s || !s.date) return false;
    const t = s.endTime || s.startTime || '23:59';
    const dt = new Date(`${s.date}T${t}`);
    return !isNaN(dt.getTime()) && dt < new Date();
  };
  const isSessionLive = (s) => {
    if (!s || !s.date) return false;
    const st = new Date(`${s.date}T${s.startTime || '00:00'}`);
    const en = new Date(`${s.date}T${s.endTime || '23:59'}`);
    const now = new Date();
    return st <= now && now <= en;
  };

  const fmtDate = (d) => {
    if (!d) return '—';
    const [y, m, dd] = d.split('-').map(Number);
    const wd = ['일','월','화','수','목','금','토'][new Date(y, m-1, dd).getDay()];
    return `${m}월 ${dd}일 (${wd})`;
  };
  // 회차 소요 시간 (분) → "3시간 30분"
  const durationOf = (s) => {
    if (!s.startTime || !s.endTime) return null;
    const [sh, sm] = s.startTime.split(':').map(Number);
    const [eh, em] = s.endTime.split(':').map(Number);
    const mins = (eh * 60 + em) - (sh * 60 + sm);
    if (!(mins > 0)) return null;
    const h = Math.floor(mins / 60), m = mins % 60;
    return `${h ? `${h}시간` : ''}${h && m ? ' ' : ''}${m ? `${m}분` : ''}`;
  };
  const fmtRange = (a, b) => {
    if (!a) return '—';
    return (!b || b === a) ? fmtDate(a) : `${fmtDate(a)} ~ ${fmtDate(b)}`;
  };

      const all = [];
      options.forEach(o => o.sessions.forEach(s => { if (!isSessionPast(s)) all.push({ ...s, optName:o.name }); }));
      all.sort((a,b) => `${a.date}T${a.startTime}`.localeCompare(`${b.date}T${b.startTime}`));
      return all[0] || null;
    }, [options]);

    const goEdit = () => { window.location.href = `offline-builder.html?courseId=${courseId}`; };

    const enrollMethodText = () => {
      const t = [];
      if (enroll.isSelfEnroll) t.push('회원 직접 신청');
      if (enroll.adminAssign) t.push('관리자 지정 등록');
      return t.length ? t.join(' + ') : null;
    };

    return (
      <div className="relative flex flex-col h-screen overflow-hidden bg-[#f2f5f9]">

        {/* ── 헤더 ── */}
        <header className="shrink-0 px-4 pt-4 pr-[516px]">
          <div className="bg-white border border-slate-200 rounded-2xl shadow-sm px-5 py-3 flex justify-between items-center">
            <div className="flex items-center gap-3 min-w-0">
              <a href="offline-list.html" className="w-8 h-8 bg-slate-100 text-slate-500 rounded-lg flex items-center justify-center hover:bg-slate-200 transition-colors shrink-0" title="코스 목록">
                <ChevronLeft size={18}/>
              </a>
              <div className="w-8 h-8 bg-indigo-600 text-white rounded-lg flex items-center justify-center shadow-sm shrink-0"><MapPin size={18}/></div>
              <div className="min-w-0">
                <h1 className="text-lg font-extrabold text-slate-900 leading-tight truncate">{info.title}</h1>
                <p className="text-[11.5px] text-slate-400 font-medium leading-tight mt-0.5">오프라인 코스 · 읽기 전용</p>
              </div>

              {/* 상태 칩 — 지금 공개 중인지, 그리고 누가 손대고 있는지 */}
              <div className="flex items-center gap-1.5 ml-2 shrink-0">
                {isClosed ? (
                  <span className="px-3 py-1 rounded-full text-[12px] font-bold border bg-slate-100 text-slate-500 border-slate-300 flex items-center gap-1.5">
                    <Lock size={10}/> 종료
                    <span className="font-medium text-slate-400">· 수정 불가</span>
                  </span>
                ) : (
                  <span className="px-3 py-1 rounded-full text-[12px] font-bold border bg-emerald-50 text-emerald-700 border-emerald-200 flex items-center gap-1.5">
                    <CircleDot size={10}/> 공개 중
                    <span className="font-medium text-emerald-600/80">
                      · {new Date(data.publishedAt).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})} 반영
                    </span>
                  </span>
                )}
                {/* 동시 편집 충돌 방지 — 건수·diff 없이 "누가 언제부터"만 */}
                {hasDraft && (
                  <span className="px-3 py-1 rounded-full text-[12px] font-bold border bg-amber-50 text-amber-700 border-amber-300 flex items-center gap-1.5"
                    title={`${fmtDT(draft.editedAt)}부터 수정 중 — 퍼블리시 전까지 공개본은 그대로입니다`}>
                    <Edit3 size={10}/> {draft.editor} 수정 중
                  </span>
                )}
              </div>
            </div>

            <div className="flex items-center gap-2 shrink-0">
              <a href={`offline-view.html?id=${courseId}`}
                className="px-3.5 py-2 bg-white border border-slate-300 text-slate-700 rounded-lg text-sm font-bold hover:bg-slate-50 transition-colors flex items-center gap-1.5 shadow-sm">
                <Users size={15}/> 운영 현황
              </a>
              {/* 종료 코스는 버튼 자체를 두지 않는다 — 칩이 이미 "수정 불가"라고 말한다 */}
              {!isClosed && (
                hasDraft ? (
                  <button onClick={goEdit}
                    className="px-4 py-2 bg-amber-500 text-white rounded-lg text-sm font-bold hover:bg-amber-600 transition-colors flex items-center gap-1.5 shadow-sm">
                    <Edit3 size={15}/> 이어서 수정
                  </button>
                ) : (
                  <button onClick={() => setModal('start')}
                    className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-bold hover:bg-indigo-700 transition-colors flex items-center gap-1.5 shadow-sm">
                    <Edit3 size={15}/> 수정
                  </button>
                )
              )}
            </div>
          </div>
        </header>

        <div className="flex-1 flex overflow-hidden pr-[500px]">

          {/* ── 좌측 요약 ── */}
          <nav className="w-[224px] shrink-0 px-4 pt-2 pb-4 overflow-y-auto custom-scrollbar h-full">
            <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-4 sticky top-2">
              <div className="mb-4">
                <div className="text-[10px] font-bold text-slate-400 tracking-widest mb-1">등록 현황</div>
                <div className="flex items-baseline gap-1.5">
                  <span className="text-[22px] font-black tabular-nums text-slate-900">{totalEnrolled}</span>
                  <span className="text-[12px] font-bold text-slate-500">/ {totalCap} 명</span>
                </div>
                <div className="mt-2 h-1 bg-slate-100 rounded-full overflow-hidden">
                  <div className="h-full bg-indigo-500 transition-all" style={{ width:`${totalCap ? Math.min(100, totalEnrolled/totalCap*100) : 0}%` }}/>
                </div>
              </div>

              {nextSession && (
                <div className="mb-4 px-2.5 py-2 bg-indigo-50 border border-indigo-100 rounded-lg">
                  <div className="text-[10px] font-bold text-indigo-400 tracking-wide mb-0.5">다음 회차</div>
                  <div className="text-[12px] font-bold text-indigo-800 leading-snug">{fmtDate(nextSession.date)}</div>
                  <div className="text-[11px] text-indigo-600 tabular-nums mt-0.5">{nextSession.startTime}~{nextSession.endTime} · {nextSession.optName}</div>
                </div>
              )}

              <div className="space-y-0.5">
                {[
                  { id:'s-info',  label:'코스 기본 정보', detail:`${info.category} · ${info.instructor}` },
                  { id:'s-enrl',  label:'모집·신청 설정', detail:enrollMethodText() || '미설정' },
                  { id:'s-comp',  label:'수료 조건',      detail:`출석률 ${completion.minRate}% 이상` },
                ].map((s, i) => (
                  <a key={s.id} href={`#${s.id}`} className="block px-2.5 py-2 rounded-lg hover:bg-slate-50 transition-colors">
                    <div className="flex items-center gap-2">
                      <span className="w-5 h-5 rounded-full bg-slate-100 text-slate-500 border border-slate-200 flex items-center justify-center text-[10px] font-black shrink-0">
                        {String(i+1).padStart(2,'0')}
                      </span>
                      <span className="flex-1 truncate font-bold text-[12.5px] text-slate-700">{s.label}</span>
                    </div>
                    <p className="text-[10px] text-slate-500 mt-1 ml-7 leading-snug truncate">{s.detail}</p>
                  </a>
                ))}
              </div>

              {/* 수정 진입점은 헤더 하나 — 헤더는 항상 보이므로 여기 또 둘 이유가 없다 */}
            </div>
          </nav>

          {/* ── 본문 (좌측 정보단) ── */}
          <main className="flex-1 overflow-y-auto custom-scrollbar py-8 space-y-6 animate-fadeIn pb-32">
            <div className="w-[800px] mx-auto space-y-6">

              {/* 종료 코스 안내 */}
              {isClosed && (
                <div className="bg-slate-100 border border-slate-300 rounded-2xl px-5 py-4 flex items-start gap-3">
                  <div className="w-8 h-8 rounded-lg bg-slate-400 text-white flex items-center justify-center shrink-0"><Lock size={16}/></div>
                  <div className="flex-1 min-w-0">
                    <h3 className="text-[14px] font-extrabold text-slate-700">운영이 종료된 코스입니다</h3>
                    <p className="text-[12px] text-slate-500 mt-1 leading-relaxed">
                      출결·수료 기록이 확정되어 내용을 변경할 수 없습니다. 등록자와 수료 결과는 <strong className="text-slate-600">[운영 현황]</strong>에서 확인하세요.
                    </p>
                  </div>
                </div>
              )}

              {/* 섹션 1 — 코스 기본 정보 */}
              <div id="s-info">
                <SectionCard num="1" title="코스 기본 정보" hint="코스명 · 분류 · 강사 · 장소"
                  open={sec.s1} onToggle={() => setSec(p => ({...p, s1:!p.s1}))}>
                  <Row label="코스명"      value={info.title}/>
                  <Row label="코스 분류"   value={info.category} empty={!info.category}/>
                  <Row label="대표 강사"   value={info.instructor}/>
                  <Row label="강사 소개"   value={info.instructorDesc} multiline empty={!info.instructorDesc}/>
                  <Row label="코스 소개"   value={info.intro} multiline empty={!info.intro}/>
                  <Row label="교육 장소"   value={info.location}/>
                  <Row label="상세 주소"   value={info.address} empty={!info.address}/>
                  <Row label="오시는 길"   value={info.traffic} multiline empty={!info.traffic}/>
                  <Row label="커버 이미지"
                    value={info.hasCover
                      ? <span className="inline-flex items-center gap-1.5 text-emerald-700"><ImageIcon size={13}/> 등록됨</span>
                      : null}
                    empty={!info.hasCover}/>
                </SectionCard>
              </div>

              {/* 섹션 2 — 모집 및 수강 신청 설정 */}
              <div id="s-enrl">
                <SectionCard num="2" title="모집 및 수강 신청 설정" hint="신청 기간 · 등록 방식 · 권한"
                  open={sec.s2} onToggle={() => setSec(p => ({...p, s2:!p.s2}))}>
                  <Row label="신청 기간"
                    value={enroll.regNoLimit
                      ? <span className="inline-flex items-center gap-1.5"><span className="px-1.5 py-0.5 rounded bg-amber-100 text-amber-700 text-[11px] font-bold">상시 모집</span><span className="text-slate-500 text-[12.5px]">마감은 차수별 일정·정원에서 결정</span></span>
                      : <span className="tabular-nums">{fmtDT(enroll.regStart)} ~ {fmtDT(enroll.regEnd)}</span>}/>
                  <Row label="등록 방식" value={enrollMethodText()} empty={!enrollMethodText()}/>
                  <Row label="신청 권한"
                    value={enroll.eligibleGroups.length
                      ? <span className="flex items-center gap-1 flex-wrap">
                          {enroll.eligibleGroups.map(g => (
                            <span key={g} className="px-2 py-0.5 rounded-full bg-slate-100 border border-slate-200 text-[11.5px] font-bold text-slate-600">{g}</span>
                          ))}
                        </span>
                      : null}
                    empty={!enroll.eligibleGroups.length} multiline/>
                  <Row label="차수 선택 방식"
                    value={enroll.selectionRule === 'single' ? '차수 1개 선택 (단일 선택형)' : '여러 차수 선택 (다중 조합형)'}/>
                  <Row label="취소 정책"
                    value={!enroll.cancelPolicy.enabled ? null
                      : enroll.cancelPolicy.mode === 'blocked' ? '신청 후 취소 불가'
                      : `교육 시작 ${enroll.cancelPolicy.relativeValue}${enroll.cancelPolicy.relativeUnit === 'day' ? '일' : '시간'} 전까지 취소 가능`}
                    empty={!enroll.cancelPolicy.enabled}/>
                  <Row label="차수 변경 정책"
                    value={!enroll.changePolicy.enabled ? null
                      : `교육 시작 ${enroll.changePolicy.relativeValue}${enroll.changePolicy.relativeUnit === 'day' ? '일' : '시간'} 전까지 변경 가능`}
                    empty={!enroll.changePolicy.enabled}/>
                </SectionCard>
              </div>

              {/* 섹션 3 — 수료 조건 */}
              <div id="s-comp">
                <SectionCard num="3" title="수료 조건" hint="출석률 기준"
                  open={sec.s3} onToggle={() => setSec(p => ({...p, s3:!p.s3}))}>
                  <div className="py-4">
                    <div className="flex items-center gap-4 px-4 py-4 bg-slate-50 border border-slate-200 rounded-xl">
                      <div className="w-10 h-10 rounded-lg bg-emerald-500 text-white flex items-center justify-center shrink-0"><Award size={20}/></div>
                      <div className="flex-1">
                        <div className="flex items-center gap-2">
                          <span className="text-[14px] font-extrabold text-slate-800">오프라인 출석</span>
                          <span className="px-1.5 py-0.5 rounded bg-slate-200 text-slate-600 text-[10px] font-bold">필수</span>
                        </div>
                        <p className="text-[12px] text-slate-500 mt-0.5">
                          등록한 차수의 회차 기준 출석률 · 지각은 출석으로 인정
                        </p>
                      </div>
                      <div className="text-right shrink-0">
                        <div className="flex items-baseline gap-1 justify-end">
                          <span className="text-[26px] font-black text-emerald-600 tabular-nums leading-none">{completion.minRate}</span>
                          <span className="text-[13px] font-bold text-emerald-600">%</span>
                        </div>
                        <div className="text-[11px] text-slate-400 font-bold mt-0.5">이상</div>
                      </div>
                    </div>
                  </div>
                </SectionCard>
              </div>

            </div>
          </main>

          {/* ── 우측 차수 · 회차 (읽기 전용) ── */}
          <aside className="absolute top-0 right-0 w-[500px] h-screen bg-white border-l border-slate-200 flex flex-col z-30 shadow-[-10px_0_20px_-10px_rgba(0,0,0,0.05)] shrink-0 overflow-hidden">
            <div className="px-4 py-2.5 border-b border-slate-200 shrink-0 bg-slate-900 text-white flex items-center gap-2">
              <Calendar size={14} className="text-indigo-400 shrink-0"/>
              <h3 className="font-bold text-[13px]">차수 · 회차</h3>
              <span className="text-[11px] text-slate-500 ml-1">· 읽기 전용</span>
              <span className="ml-auto inline-flex items-center gap-1 text-[10px] font-bold text-slate-400 border border-slate-700 rounded px-1.5 py-0.5">
                <Lock size={9}/> {isClosed ? '종료 — 변경 불가' : '수정은 [수정] 버튼'}
              </span>
            </div>

            {/* 통계 바 */}
            <div className="px-5 py-3 border-b border-slate-700 shrink-0 bg-slate-800 flex items-center gap-3">
              <div className="flex items-center gap-1.5">
                <span className="text-[16px] font-black text-white tabular-nums">{options.length}</span>
                <span className="text-[11px] text-slate-400">차수</span>
              </div>
              <div className="w-px h-3.5 bg-slate-600"/>
              <div className="flex items-center gap-1.5">
                <span className="text-[16px] font-black text-white tabular-nums">{totalSessions}</span>
                <span className="text-[11px] text-slate-400">총 회차</span>
              </div>
              <div className="w-px h-3.5 bg-slate-600"/>
              <div className="flex items-center gap-1.5">
                <span className="text-[16px] font-black text-white tabular-nums">{totalEnrolled}</span>
                <span className="text-[11px] text-slate-400">/ {totalCap} 등록</span>
              </div>
              {pastCount > 0 && (
                <span className="ml-auto inline-flex items-center gap-1 text-[10.5px] font-bold text-slate-300 bg-slate-700 border border-slate-600 rounded px-2 py-1">
                  <Lock size={10}/> 종료 {pastCount}회차
                </span>
              )}
            </div>

            <div className="flex-1 overflow-y-auto custom-scrollbar bg-[#f4f7fc]">

              {pastCount > 0 && (
                <div className="mx-5 mt-4 px-3.5 py-2.5 bg-slate-100 border border-slate-300 rounded-lg flex items-start gap-2">
                  <Lock size={13} className="text-slate-500 mt-0.5 shrink-0"/>
                  <p className="text-[11px] text-slate-600 leading-relaxed">
                    이미 <strong>종료된 회차</strong>는 출결 기록 보호를 위해 수정 모드에서도 변경·삭제할 수 없습니다.
                    <span className="block text-slate-400 mt-0.5">버전이 바뀌어도 과거 회차는 그대로 유지됩니다.</span>
                  </p>
                </div>
              )}

              <div className="px-5 pt-4 pb-6 space-y-4">
                {options.map((opt, oi) => {
                  const isCol = !!collapsed[opt.id];
                  const done = opt.sessions.every(isSessionPast);
                  const live = opt.sessions.some(isSessionLive) || (opt.sessions.some(isSessionPast) && !done);
                  const over = opt.enrolled > opt.capacity;
                  const optPast = opt.sessions.filter(isSessionPast).length;
                  const optMins = opt.sessions.reduce((sum, s) => {
                    const [sh, sm] = (s.startTime || '0:0').split(':').map(Number);
                    const [eh, em] = (s.endTime || '0:0').split(':').map(Number);
                    return sum + Math.max(0, (eh*60+em) - (sh*60+sm));
                  }, 0);
                  // 차수 강사 — 대표 강사와 다를 때만 의미가 있다 (3단 상속: 회차 → 차수 → 대표)
                  const cohortInstr = opt.instructor && opt.instructor !== info.instructor ? opt.instructor : null;
                  const badge = done
                    ? { t:'완료', c:'bg-slate-200 text-slate-600 border-slate-300' }
                    : live
                      ? { t:'진행중', c:'bg-emerald-100 text-emerald-700 border-emerald-300' }
                      : { t:'예정', c:'bg-indigo-100 text-indigo-700 border-indigo-300' };

                  return (
                    <div key={opt.id} className="bg-white border-2 border-slate-200 rounded-xl overflow-hidden shadow-sm">
                      {/* 차수 헤더 */}
                      <div className="bg-slate-900">
                        <div className="px-4 py-2.5 flex items-center gap-2.5">
                          <span className="shrink-0 inline-flex items-center px-2.5 py-0.5 rounded-full bg-indigo-500 text-white text-[12px] font-extrabold tabular-nums">{oi+1}차수</span>
                          <span className="flex-1 text-[14px] font-bold text-white truncate">{opt.name}</span>
                          <span className={`shrink-0 px-2 py-0.5 rounded-full text-[10.5px] font-bold border ${badge.c}`}>{badge.t}</span>
                          <button onClick={() => setCollapsed(p => ({...p, [opt.id]: !isCol}))}
                            className="p-1 rounded text-slate-500 hover:text-white hover:bg-slate-700 transition-colors shrink-0">
                            {isCol ? <ChevronDown size={14}/> : <ChevronUp size={14}/>}
                          </button>
                        </div>
                        {/* 메타 1행 — 기간 · 회차 · 총 교육시간 */}
                        <div className="px-4 py-2 bg-slate-800 border-t border-slate-700 flex items-center gap-3">
                          <span className="flex items-center gap-1.5 shrink-0 text-[11.5px] font-bold text-slate-200 tabular-nums">
                            <Calendar size={11} className="text-slate-500 shrink-0"/> {fmtRange(opt.startDate, opt.endDate)}
                          </span>
                          <div className="w-px h-3.5 bg-slate-600"/>
                          <span className="text-[11px] font-bold text-slate-400 shrink-0 tabular-nums">
                            {opt.sessions.length}회차
                            {optPast > 0 && !done && <span className="text-slate-500 font-medium"> · {optPast} 종료</span>}
                          </span>
                          {optMins > 0 && (
                            <>
                              <div className="w-px h-3.5 bg-slate-600"/>
                              <span className="flex items-center gap-1 text-[11px] text-slate-400 shrink-0 tabular-nums">
                                <Clock size={10} className="shrink-0"/> 총 {Math.floor(optMins/60)}시간{optMins%60 ? ` ${optMins%60}분` : ''}
                              </span>
                            </>
                          )}
                          <a href={`offline-view.html?id=${courseId}`}
                            className="ml-auto shrink-0 text-[10.5px] font-bold text-indigo-300 hover:text-white border border-indigo-500/40 hover:border-indigo-400 px-2 py-1 rounded transition-colors">
                            등록자
                          </a>
                        </div>

                        {/* 메타 2행 — 정원 · 장소 · 차수 강사 */}
                        <div className="px-4 py-2 bg-slate-800/60 border-t border-slate-700/60 flex items-center gap-3">
                          <div className="flex items-center gap-1.5 shrink-0">
                            <Users size={11} className="text-slate-500"/>
                            <span className={`text-[12px] font-bold tabular-nums ${over ? 'text-rose-300' : 'text-white'}`}>{opt.enrolled}</span>
                            <span className="text-[11px] text-slate-500 tabular-nums">/ {opt.capacity}명</span>
                            {over && <span className="px-1 py-0.5 rounded bg-rose-900/60 border border-rose-700 text-rose-200 text-[9.5px] font-bold">초과</span>}
                          </div>
                          <div className="w-px h-3.5 bg-slate-600"/>
                          <span className="flex items-center gap-1 text-[11px] text-slate-400 truncate">
                            <MapPin size={10} className="shrink-0"/> {opt.place || '장소 미지정'}
                          </span>
                          {cohortInstr && (
                            <>
                              <div className="w-px h-3.5 bg-slate-600 shrink-0"/>
                              <span className="flex items-center gap-1 text-[11px] shrink-0" title="이 차수 전담 강사 — 회차에 지정이 없으면 이 강사가 적용됩니다">
                                <User size={10} className="text-slate-500 shrink-0"/>
                                <span className="text-amber-300 font-bold">{cohortInstr}</span>
                              </span>
                            </>
                          )}
                        </div>

                        {/* 메타 3행 — 차수별 신청 권한 (설정된 경우만) */}
                        {opt.groups && opt.groups.length > 0 && (
                          <div className="px-4 py-2 bg-slate-800/60 border-t border-slate-700/60 flex items-center gap-1.5 flex-wrap">
                            <span className="text-[10px] font-bold text-slate-500 shrink-0">신청 권한</span>
                            {opt.groups.map(g => (
                              <span key={g.id || g} className="px-1.5 py-0.5 rounded bg-slate-700 border border-slate-600 text-slate-200 text-[10.5px] font-bold">
                                {g.name || g}
                              </span>
                            ))}
                          </div>
                        )}
                      </div>

                      {/* 회차 목록 */}
                      {!isCol && (
                        <div className="divide-y divide-slate-100">
                          {opt.sessions.map((s, si) => {
                            const past = isSessionPast(s);
                            const now = isSessionLive(s);
                            const dur = durationOf(s);
                            // 회차 강사가 따로 지정된 경우만 표시 — 없으면 차수/대표 강사를 그대로 따른다
                            const sessInstr = s.instructor && s.instructor !== (opt.instructor || info.instructor) ? s.instructor : null;
                            const sessPlace = s.place && s.place !== opt.place ? s.place : null;
                            return (
                              <div key={s.id} className={`px-4 py-2.5 flex items-start gap-3 ${past ? 'bg-slate-50' : 'bg-white'}`}>
                                <span className={`w-6 h-6 mt-0.5 rounded-lg flex items-center justify-center text-[11px] font-black tabular-nums shrink-0
                                  ${past ? 'bg-slate-200 text-slate-500' : now ? 'bg-emerald-500 text-white' : 'bg-indigo-100 text-indigo-700'}`}>
                                  {si+1}
                                </span>
                                <div className="min-w-0 flex-1">
                                  <div className={`text-[13px] font-bold truncate ${past ? 'text-slate-500' : 'text-slate-800'}`}>{s.name}</div>
                                  <div className={`text-[11.5px] tabular-nums mt-0.5 ${past ? 'text-slate-400' : 'text-slate-500'}`}>
                                    {fmtDate(s.date)} · {s.startTime}~{s.endTime}
                                    {dur && <span className={past ? 'text-slate-300' : 'text-slate-400'}> · {dur}</span>}
                                  </div>
                                  {(sessInstr || sessPlace || s.capacity) && (
                                    <div className="flex items-center gap-2 flex-wrap mt-1">
                                      {sessInstr && (
                                        <span className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded bg-amber-50 border border-amber-200 text-amber-700 text-[10.5px] font-bold"
                                          title="이 회차만 다른 강사">
                                          <User size={9}/> {sessInstr}
                                        </span>
                                      )}
                                      {sessPlace && (
                                        <span className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded bg-violet-50 border border-violet-200 text-violet-700 text-[10.5px] font-bold"
                                          title="이 회차만 다른 장소">
                                          <MapPin size={9}/> {sessPlace}
                                        </span>
                                      )}
                                      {s.capacity && (
                                        <span className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded bg-slate-100 border border-slate-200 text-slate-600 text-[10.5px] font-bold tabular-nums"
                                          title="이 회차만 다른 정원">
                                          <Users size={9}/> {s.capacity}명
                                        </span>
                                      )}
                                    </div>
                                  )}
                                </div>
                                {now && <span className="shrink-0 mt-0.5 px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700 border border-emerald-200 text-[10px] font-bold">진행중</span>}
                                {past && (
                                  <span className="shrink-0 mt-0.5 inline-flex items-center gap-1 px-1.5 py-0.5 rounded bg-slate-200 text-slate-500 text-[10px] font-bold" title="종료 — 수정 불가">
                                    <Lock size={9}/> 종료
                                  </span>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          </aside>
        </div>

        {/* ── 데모 상태 토글 (드래프트 더미가 있는 코스에서만) ── */}
        <div className={`fixed bottom-4 left-4 z-[200] bg-slate-900/95 text-white rounded-xl shadow-2xl px-3 py-2.5 items-center gap-2.5 ${canDraft ? 'flex' : 'hidden'}`}>
          <span className="text-[10px] font-bold text-slate-400 tracking-widest">DEMO</span>
          <div className="flex bg-slate-800 rounded-lg p-0.5">
            <button onClick={() => setHasDraft(false)}
              className={`px-2.5 py-1 rounded-md text-[11px] font-bold transition-colors ${!hasDraft ? 'bg-emerald-500 text-white' : 'text-slate-400 hover:text-white'}`}>
              공개 중
            </button>
            <button onClick={() => setHasDraft(true)}
              className={`px-2.5 py-1 rounded-md text-[11px] font-bold transition-colors ${hasDraft ? 'bg-amber-500 text-white' : 'text-slate-400 hover:text-white'}`}>
              수정 중(드래프트)
            </button>
          </div>
        </div>

        {/* ── 모달: 수정 시작 확인 ── */}
        {modal === 'start' && (
          <div className="fixed inset-0 bg-slate-900/70 z-[300] flex items-center justify-center px-4" onClick={() => setModal(null)}>
            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-[460px] overflow-hidden animate-modalFade" onClick={e => e.stopPropagation()}>
              <div className="px-6 pt-6 pb-4">
                <div className="w-11 h-11 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center mb-3.5"><Edit3 size={20}/></div>
                <h3 className="text-[17px] font-extrabold text-slate-900">수정 모드로 전환할까요?</h3>
                <p className="text-[13px] text-slate-500 mt-1.5 leading-relaxed">
                  운영 중인 코스입니다. 수정 내용은 별도로 보관되고, <strong className="text-slate-700">퍼블리시</strong>할 때 수강생 화면에 반영됩니다.
                </p>

                <div className="mt-4 space-y-2">
                  {[
                    { i: CheckCircle, c:'text-emerald-500', t:'지금 공개 중인 내용은 그대로 서비스됩니다' },
                    { i: Lock,        c:'text-slate-400',   t:'이미 종료된 회차는 수정할 수 없습니다' },
                    { i: AlertTriangle, c:'text-amber-500', t:'정원·일정 변경은 퍼블리시 전에 등록자 영향을 확인합니다' },
                  ].map((r, i) => (
                    <div key={i} className="flex items-start gap-2.5 px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg">
                      <r.i size={15} className={`${r.c} mt-0.5 shrink-0`}/>
                      <span className="text-[12.5px] text-slate-600 leading-snug">{r.t}</span>
                    </div>
                  ))}
                </div>
              </div>
              <div className="px-6 py-4 bg-slate-50 border-t border-slate-200 flex gap-2 justify-end">
                <button onClick={() => setModal(null)} className="px-4 py-2 rounded-lg text-[13px] font-bold text-slate-600 hover:bg-slate-200 transition-colors">취소</button>
                <button onClick={goEdit} className="px-4 py-2 rounded-lg bg-indigo-600 text-white text-[13px] font-bold hover:bg-indigo-700 transition-colors flex items-center gap-1.5">
                  <Edit3 size={14}/> 수정 시작
                </button>
              </div>
            </div>
          </div>
        )}

      </div>
    );
  };

  createRoot(document.getElementById('root')).render(<App/>);
</script>
<script src="feature-highlight.js"></script>
</body>
</html>
