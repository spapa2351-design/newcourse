  /* ────────────────────────────────────────────────────────────────

     [수정] 버튼을 누르면 드래프트 버전이 만들어지고 빌더로 이동한다.
     드래프트를 [퍼블리시]할 때까지 공개본은 그대로 서비스된다.

     ※ 필드마다 "즉시 반영 / 퍼블리시 필요" 배지를 달아
        수정 후 저장 결과가 어떻게 갈리는지 미리 알려준다.
        (진입 게이트는 [수정] 하나로 통일 — 관리자가 판단할 게 없다)
     ──────────────────────────────────────────────────────────────── */

  const isSessionPast = (s) => {
    if (!s || !s.date) return false;
    const t = s.endTime || s.startTime || '23:59';
    const dt = new Date(`${s.date}T${t}`);
    return !isNaN(dt.getTime()) && dt < new Date();
  };
  const isSessionLive = (s) => {
    if (!s || !s.date) return false;
    const st = new Date(`${s.date}T${s.startTime || '00:00'}`);
    const en = new Date(`${s.date}T${s.endTime || '23:59'}`);
    const now = new Date();
    return st <= now && now <= en;
  };

  const fmtDate = (d) => {
    if (!d) return '—';
    const [y, m, dd] = d.split('-').map(Number);
    const wd = ['일','월','화','수','목','금','토'][new Date(y, m-1, dd).getDay()];
    return `${m}월 ${dd}일 (${wd})`;
  };
  const fmtDT = (v) => {
    if (!v) return '—';
    const dt = new Date(v);
    if (isNaN(dt.getTime())) return v;
    return dt.toLocaleString('ko-KR', { year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' });
  };

  /* ── 회차 생성 헬퍼 (더미 데이터용) ── */
  let _sid = 500;
  const days = (startDate, n, st = '09:00', et = '18:00') => {   // 시작일부터 n일 연속
    const [y, m, d] = startDate.split('-').map(Number);
    return Array.from({ length: n }, (_, i) => {
      const dt = new Date(y, m - 1, d + i);
      const iso = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      return { id: ++_sid, name: `${i+1}회차`, date: iso, startTime: st, endTime: et };
    });
  };
  const slots = (date, times) =>                                  // 같은 날 여러 회차
    times.map(([st, et], i) => ({ id: ++_sid, name: `${i+1}회차`, date, startTime: st, endTime: et }));

    6: {

        instructor:'한소희', instructorDesc:'CS 교육 15년 · 서비스 아카데미 수석강사',
        intro:'대면·비대면 응대 상황별 스크립트와 클레임 대응을 실습합니다.',
        location:'한샘 HQ 대교육장', address:'서울 강남구 테헤란로 152',

        { id:104, name:'4기 (4/28~4/30)', capacity:30, enrolled:20, place:'판교 연수원',     sessions: days('2026-04-28', 3, '09:00','12:00') },

        { id:112, name:'2차 워크숍', capacity:25, enrolled:18, place:'한샘 HQ 세미나룸',

  );

  // 읽기 전용 값 행 — 입력창처럼 보이지 않게 값만 텍스트로 표시
  const Row = ({ label, value, live, mono, multiline, empty }) => (
    <div className="flex gap-4 py-3 border-b border-slate-100 last:border-0">
      <div className="w-[132px] shrink-0 pt-0.5 flex items-start gap-1.5">

      <div className="flex-1 min-w-0">
        <div className={`text-[14px] leading-relaxed break-words
          ${empty ? 'text-slate-400 italic' : 'text-slate-800 font-medium'}
          ${mono ? 'tabular-nums' : ''} ${multiline ? '' : 'truncate'}`}>
          {empty ? '설정 없음' : value}
        </div>

      <div className="shrink-0 pt-0.5"><Tier live={live}/></div>

  const SectionCard = ({ num, icon: Icon, title, hint, open, onToggle, children }) => (
    <section className="scroll-mt-6 bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
      <div className="bg-slate-50 border-b border-slate-100 px-6 py-4 flex items-center gap-2.5 cursor-pointer select-none" onClick={onToggle}>

      <div className={`px-6 py-2 ${open ? '' : 'hidden'}`}>{children}</div>

  );

  const App = () => {
    const params = new URLSearchParams(window.location.search);
    const courseId = Number(params.get('courseId') || 1);
    const data = COURSE_DATA[courseId] || COURSE_DATA[1];

    // 종료된 코스는 같은 화면으로 열리되 수정 진입점이 없다
    const isClosed = data.status === 'closed' || params.get('closed') === '1';
    const canDraft = !!data.draft && !isClosed;

    // 데모 토글 — 공개 중 / 수정 중(드래프트 존재)

    const [toast, setToast] = useState(null);

    const { info, enroll, completion, options, draft } = data;

    const totalSessions = options.reduce((s,o) => s + o.sessions.length, 0);
    const totalCap = options.reduce((s,o) => s + o.capacity, 0);
    const totalEnrolled = options.reduce((s,o) => s + o.enrolled, 0);
    const pastCount = options.reduce((s,o) => s + o.sessions.filter(isSessionPast).length, 0);

      const all = [];
      options.forEach(o => o.sessions.forEach(s => { if (!isSessionPast(s)) all.push({ ...s, optName:o.name }); }));

      return all[0] || null;
    }, [options]);

    const dangerCount = hasDraft ? draft.changes.filter(c => c.impact === 'danger').length : 0;
    const warnCount   = hasDraft ? draft.changes.filter(c => c.impact === 'warn').length : 0;

    const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2600); };

                <p className="text-[11.5px] text-slate-400 font-medium leading-tight mt-0.5">오프라인 코스 · 읽기 전용</p>
              </div>

              {/* 상태 칩 — 공개본 / 작업본 2트랙 */}

                  </span>
                ) : (
                  <span className="px-3 py-1 rounded-full text-[12px] font-bold border bg-emerald-50 text-emerald-700 border-emerald-200 flex items-center gap-1.5">

                      {/* 회차 목록 */}
                      {!isCol && (
                        <div className="divide-y divide-slate-100">
                          {opt.sessions.map((s, si) => {
                            const past = isSessionPast(s);
                            const now = isSessionLive(s);
                            return (
                              <div key={s.id} className={`px-4 py-2.5 flex items-center gap-3 ${past ? 'bg-slate-50' : 'bg-white'}`}>
                                <span className={`w-6 h-6 rounded-lg flex items-center justify-center text-[11px] font-black tabular-nums shrink-0
                                  ${past ? 'bg-slate-200 text-slate-500' : now ? 'bg-emerald-500 text-white' : 'bg-indigo-100 text-indigo-700'}`}>
                                  {si+1}
                                </span>
                                <div className="min-w-0 flex-1">
                                  <div className={`text-[13px] font-bold truncate ${past ? 'text-slate-500' : 'text-slate-800'}`}>{s.name}</div>
                                  <div className={`text-[11.5px] tabular-nums mt-0.5 ${past ? 'text-slate-400' : 'text-slate-500'}`}>
                                    {fmtDate(s.date)} · {s.startTime}~{s.endTime}
                                  </div>
                                </div>
                                {now && <span className="shrink-0 px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700 border border-emerald-200 text-[10px] font-bold">진행중</span>}
                                {past && (
                                  <span className="shrink-0 inline-flex items-center gap-1 px-1.5 py-0.5 rounded bg-slate-200 text-slate-500 text-[10px] font-bold" title="종료 — 수정 불가">
                                    <Lock size={9}/> 종료
                                  </span>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          </aside>
        </div>

        {/* ── 데모 상태 토글 (드래프트 더미가 있는 코스에서만) ── */}
        <div className={`fixed bottom-4 left-4 z-[200] bg-slate-900/95 text-white rounded-xl shadow-2xl px-3 py-2.5 items-center gap-2.5 ${canDraft ? 'flex' : 'hidden'}`}>
          <span className="text-[10px] font-bold text-slate-400 tracking-widest">DEMO</span>
          <div className="flex bg-slate-800 rounded-lg p-0.5">
            <button onClick={() => setHasDraft(false)}
              className={`px-2.5 py-1 rounded-md text-[11px] font-bold transition-colors ${!hasDraft ? 'bg-emerald-500 text-white' : 'text-slate-400 hover:text-white'}`}>
              공개 중
            </button>
            <button onClick={() => setHasDraft(true)}
              className={`px-2.5 py-1 rounded-md text-[11px] font-bold transition-colors ${hasDraft ? 'bg-amber-500 text-white' : 'text-slate-400 hover:text-white'}`}>
              수정 중(드래프트)
            </button>
          </div>
        </div>

        {/* ── 모달: 수정 시작 확인 ── */}
        {modal === 'start' && (
          <div className="fixed inset-0 bg-slate-900/70 z-[300] flex items-center justify-center px-4" onClick={() => setModal(null)}>
            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-[460px] overflow-hidden animate-modalFade" onClick={e => e.stopPropagation()}>
              <div className="px-6 pt-6 pb-4">
                <div className="w-11 h-11 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center mb-3.5"><Edit3 size={20}/></div>
                <h3 className="text-[17px] font-extrabold text-slate-900">수정 모드로 전환할까요?</h3>
                <p className="text-[13px] text-slate-500 mt-1.5 leading-relaxed">
                  운영 중인 코스입니다. 수정 내용은 별도로 보관되고, <strong className="text-slate-700">퍼블리시</strong>할 때 수강생 화면에 반영됩니다.
                </p>

                <div className="mt-4 space-y-2">
                  {[
                    { i: CheckCircle, c:'text-emerald-500', t:'지금 공개 중인 내용은 그대로 서비스됩니다' },
                    { i: Lock,        c:'text-slate-400',   t:'이미 종료된 회차는 수정할 수 없습니다' },
                    { i: AlertTriangle, c:'text-amber-500', t:'정원·일정 변경은 퍼블리시 전에 등록자 영향을 확인합니다' },
                  ].map((r, i) => (
                    <div key={i} className="flex items-start gap-2.5 px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg">
                      <r.i size={15} className={`${r.c} mt-0.5 shrink-0`}/>
                      <span className="text-[12.5px] text-slate-600 leading-snug">{r.t}</span>
                    </div>
                  ))}
                </div>
              </div>
              <div className="px-6 py-4 bg-slate-50 border-t border-slate-200 flex gap-2 justify-end">
                <button onClick={() => setModal(null)} className="px-4 py-2 rounded-lg text-[13px] font-bold text-slate-600 hover:bg-slate-200 transition-colors">취소</button>
                <button onClick={goEdit} className="px-4 py-2 rounded-lg bg-indigo-600 text-white text-[13px] font-bold hover:bg-indigo-700 transition-colors flex items-center gap-1.5">
                  <Edit3 size={14}/> 수정 시작
                </button>
              </div>
            </div>
          </div>
        )}

        {/* ── 모달: 드래프트 폐기 ── */}
        {modal === 'discard' && (
          <div className="fixed inset-0 bg-slate-900/70 z-[300] flex items-center justify-center px-4" onClick={() => setModal(null)}>
            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-[440px] overflow-hidden animate-modalFade" onClick={e => e.stopPropagation()}>
              <div className="px-6 pt-6 pb-4">
                <div className="w-11 h-11 rounded-xl bg-rose-50 text-rose-500 flex items-center justify-center mb-3.5"><Trash2 size={20}/></div>
                <h3 className="text-[17px] font-extrabold text-slate-900">작업 중인 수정을 폐기할까요?</h3>
                <p className="text-[13px] text-slate-500 mt-1.5 leading-relaxed">
                  미공개 변경 <strong className="text-slate-700">{hasDraft ? draft.changes.length : 0}건</strong>이 사라지고,
                  현재 공개 중인 내용이 그대로 유지됩니다. 되돌릴 수 없습니다.
                </p>
                <div className="mt-3.5 px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg">
                  <p className="text-[11.5px] text-slate-500 leading-snug">
                    <strong className="text-slate-600">{hasDraft ? draft.editor : ''}</strong> · {hasDraft ? fmtDT(draft.editedAt) : ''} 수정
                  </p>
                </div>
              </div>
              <div className="px-6 py-4 bg-slate-50 border-t border-slate-200 flex gap-2 justify-end">
                <button onClick={() => setModal(null)} className="px-4 py-2 rounded-lg text-[13px] font-bold text-slate-600 hover:bg-slate-200 transition-colors">유지</button>
                <button onClick={() => { setHasDraft(false); setModal(null); showToast('수정 내용을 폐기했습니다 — 공개본 유지'); }}
                  className="px-4 py-2 rounded-lg bg-rose-600 text-white text-[13px] font-bold hover:bg-rose-700 transition-colors flex items-center gap-1.5">
                  <Trash2 size={14}/> 폐기
                </button>
              </div>
            </div>
          </div>
        )}

        {/* ── 모달: 변경 내역 (드래프트 diff) ── */}
        {modal === 'changes' && hasDraft && (
          <div className="fixed inset-0 bg-slate-900/70 z-[300] flex items-center justify-center px-4" onClick={() => setModal(null)}>
            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-[620px] max-h-[85vh] flex flex-col overflow-hidden animate-modalFade" onClick={e => e.stopPropagation()}>
              <div className="px-6 py-4 border-b border-slate-200 flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-lg bg-amber-100 text-amber-600 flex items-center justify-center shrink-0"><List size={16}/></div>
                <div className="flex-1 min-w-0">
                  <h3 className="text-[15px] font-extrabold text-slate-900">미공개 변경 내역</h3>
                  <p className="text-[11.5px] text-slate-400 mt-0.5">{draft.editor} · {fmtDT(draft.editedAt)}</p>
                </div>
                <button onClick={() => setModal(null)} className="p-1.5 rounded-lg text-slate-400 hover:bg-slate-100 transition-colors"><X size={18}/></button>
              </div>

              {(dangerCount > 0 || warnCount > 0) && (
                <div className="px-6 py-3 bg-amber-50 border-b border-amber-200 flex items-center gap-2 flex-wrap">
                  <AlertTriangle size={14} className="text-amber-500 shrink-0"/>
                  <span className="text-[12px] text-amber-800 font-medium">
                    퍼블리시 전에 확인 필요 —
                    {dangerCount > 0 && <strong> 등록자 충돌 {dangerCount}건</strong>}
                    {dangerCount > 0 && warnCount > 0 && ','}
                    {warnCount > 0 && <strong> 재통보 필요 {warnCount}건</strong>}
                  </span>
                </div>
              )}

              <div className="flex-1 overflow-y-auto custom-scrollbar px-6 py-4 space-y-2.5">
                {draft.changes.map((c, i) => {
                  const st = c.impact === 'danger'
                    ? { bd:'border-rose-200', bg:'bg-rose-50', chip:'bg-rose-500', label:'확인 필요' }
                    : c.impact === 'warn'
                      ? { bd:'border-amber-200', bg:'bg-amber-50', chip:'bg-amber-500', label:'등록자 영향' }
                      : { bd:'border-slate-200', bg:'bg-white', chip:'bg-slate-300', label:'즉시 반영 가능' };
                  return (
                    <div key={i} className={`border rounded-xl px-4 py-3 ${st.bd} ${st.bg}`}>
                      <div className="flex items-center gap-2">
                        <span className={`w-1.5 h-1.5 rounded-full shrink-0 ${st.chip}`}/>
                        <span className="text-[13px] font-extrabold text-slate-800 flex-1 truncate">{c.field}</span>
                        <span className="text-[10px] font-bold text-slate-500 shrink-0">{st.label}</span>
                      </div>
                      <div className="mt-2 flex items-center gap-2 flex-wrap text-[12.5px]">
                        <span className="px-2 py-1 rounded bg-white border border-slate-200 text-slate-400 line-through">{c.from}</span>
                        <span className="text-slate-300 font-bold">→</span>
                        <span className="px-2 py-1 rounded bg-white border border-indigo-200 text-indigo-700 font-bold">{c.to}</span>
                      </div>
                      {c.note && (
                        <p className={`text-[11.5px] mt-2 leading-snug ${c.impact === 'danger' ? 'text-rose-600 font-bold' : 'text-amber-700'}`}>
                          {c.note}
                        </p>
                      )}
                    </div>
                  );
                })}
              </div>

              <div className="px-6 py-4 bg-slate-50 border-t border-slate-200 flex gap-2 justify-end">
                <button onClick={() => setModal('discard')} className="px-4 py-2 rounded-lg text-[13px] font-bold text-slate-600 hover:bg-slate-200 transition-colors">전체 폐기</button>
                <button onClick={goEdit} className="px-4 py-2 rounded-lg bg-amber-500 text-white text-[13px] font-bold hover:bg-amber-600 transition-colors flex items-center gap-1.5">
                  <Edit3 size={14}/> 이어서 수정
                </button>
              </div>
            </div>
          </div>
        )}

        {/* 토스트 */}
        {toast && (
          <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[400] bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-2xl text-[13px] font-bold animate-fadeIn flex items-center gap-2">
            <CheckCircle size={15} className="text-emerald-400"/> {toast}
          </div>
        )}
      </div>
    );
  };

  createRoot(document.getElementById('root')).render(<App/>);
</script>
<script src="feature-highlight.js"></script>
</body>
</html>
