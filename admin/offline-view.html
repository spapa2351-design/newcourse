        {/* ══ 수강생 등록 모달 — 차수 선택 + 회원 피커(그룹=필터) + 아이디/대량 ══ */}
        {showEnrollModal && (() => {
          const cur = COURSE.packages.find(p=>p.id===enrollPkg) || COURSE.packages[0];
          const remain = cur ? Math.max(0, cur.capacity - cur.enrolled) : 0;
          // 회원 필터: 그룹(다중 OR) + 이름/아이디 검색
          const q = enrollSearch.trim().toLowerCase();
          const filtered = STUDENT_POOL.filter(s=>{
            const okG = enrollGroupFilter.size===0 || s.groups.some(g=>enrollGroupFilter.has(g));
            const okQ = !q || s.name.toLowerCase().includes(q) || s.loginId.toLowerCase().includes(q);
            return okG && okQ;
          });
          const PER = 10;
          const totalPages = Math.max(1, Math.ceil(filtered.length/PER));
          const page = Math.min(enrollPage, totalPages);
          const rows = filtered.slice((page-1)*PER, page*PER);
          /* ── 일정 겹침 검사 (2026-08-11 I14 → I15로 강화) ──
             빌더가 퍼블리싱 시점에 잡는 것과 같은 규칙을, 배정 시점에도 건다.
             빌더 검증은 스냅샷이라 그 뒤의 배정은 그대로 우회한다 — 한쪽에만 있으면 규칙이 아니라 권고다.

             I15: 처음엔 "선택 후 경고 + 확인하고 등록" opt-in이었으나 **선택 자체를 막는 것**으로 바꿨다.
             고르게 한 뒤 되돌리는 것보다 못 고르게 하는 편이 실수를 원천에서 없앤다 —
             한 사람이 같은 시간에 두 곳에 있는 건 운영 재량이 아니라 물리적으로 불가능한 일이라
             정원 초과(재량으로 늘릴 수 있음)와 달리 빠져나갈 문을 두지 않는다.

             회차선택형 차수는 학습자가 회차를 직접 고르므로 이 화면에서 대상 회차가 정해지지 않는다 →
             전 회차로 대조하면 과탐지가 되어 검사하지 않고, 그 사실을 화면에 알린다. */
          /* 그 사람이 **이미 잡혀 있는 시간** 전부. 두 출처를 합친다.
             ① 이 코스의 등록분 — `COURSE.learners`(loginId로 매칭) → 그 사람의 차수 → 그 차수의 전 회차
             ② 타 코스 등록분 — `busy` 스텁 (프로토타입에 코스 간 저장소가 없어 조회 결과를 대신한다)
             실제 구현에서는 둘을 나누지 않는다 — `(userId, startAt)`로 그 사람의 전 등록 회차를 한 번에 조회한다. */
          const takenSlotsOf = (m) => {
            const out = [];
            (LEARNERS||[]).forEach(l => {
              if (l.loginId !== m.loginId) return;
              const p = COURSE.packages.find(x => x.id === l.pkgId);
              if (!p) return;
              // 회차선택형이면 본인이 고른 회차만 잡혀 있다 (H4·H5) — 전 회차로 보면 과탐지다
              const ss = (p.sessionSelect && l.pickSessId)
                ? (p.sessions||[]).filter(x => x.id === l.pickSessId)
                : (p.sessions||[]);
              ss.forEach(x => out.push({ course:COURSE.title, pkgId:p.id, sess:x.name,
                                         date:x.date, start:x.start, end:x.end }));
            });
            (m.busy||[]).forEach(b => out.push(b));
            return out;
          };
          /* 반환: {reason:'enrolled'|'conflict', hits:[...]} — 둘 다 선택을 막지만 사유가 다르다.
             같은 차수에 이미 있으면 '겹침'이 아니라 '중복 등록'이므로 라벨을 나눈다. */
          const conflictOf = (m) => {
            if (!m || !cur) return null;
            const taken = takenSlotsOf(m);
            if (!taken.length) return null;
            if (taken.some(t => t.pkgId === cur.id)) return { reason:'enrolled', hits:[] };
            if (cur.sessionSelect) return null;   // 대상 회차가 안 정해져 판정 불가
            const hits = [];
            (cur.sessions||[]).forEach(s => taken.forEach(t => {
              if (slotConflict({date:s.date, start:s.start, end:s.end}, t)) hits.push({ sess:s, busy:t });
            }));
            return hits.length ? { reason:'conflict', hits } : null;
          };
          const filteredIds = filtered.map(s=>s.id);
          // 겹치는 회원은 선택 대상에서 제외한다 (I15) — 전체 선택·헤더 체크 상태 모두 이 기준을 쓴다
          const selectableIds = filtered.filter(s=>!conflictOf(s)).map(s=>s.id);
          const blockedCount = filteredIds.length - selectableIds.length;
          const allFilteredSelected = selectableIds.length>0 && selectableIds.every(id=>selectedMembers.has(id));
          const idLines = enrollIdText.split(/[\n,]/).map(x=>x.trim()).filter(Boolean);
          const selCount = enrollTab==='member' ? selectedMembers.size : enrollTab==='id' ? idLines.length : 0;
          const over = selCount > remain;

          const blocked = selCount===0 || over;
          const toggleMember = id => { setSelectedMembers(prev=>{const n=new Set(prev); n.has(id)?n.delete(id):n.add(id); return n;}); };
          const roleBadge = role => role==='관리자' ? 'bg-indigo-100 text-indigo-700' : role==='부관리자' ? 'bg-sky-100 text-sky-700' : '';
          return (
          <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
            <div className="bg-white rounded-2xl shadow-xl w-[940px] max-h-[88vh] flex flex-col animate-slideUp overflow-hidden">
              {/* 헤더 */}
              <div className="flex items-center justify-between px-6 pt-5 pb-4 shrink-0">
                <div className="text-[17px] font-black text-slate-900">수강생 등록</div>
                <button onClick={resetEnroll}
                  className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-400 transition-colors"><X size={16}/></button>
              </div>

              {/* 상단 고정: 코스 + 차수 + 잔여석 */}
              <div className="px-6 py-4 border-y border-slate-100 bg-slate-50/50 space-y-3 shrink-0">
                <div className="flex items-center gap-4">
                  <span className="text-[13px] font-bold text-slate-400 w-9 shrink-0">코스</span>
                  <span className="text-[14px] font-bold text-slate-800 truncate">{COURSE.title}</span>
                </div>
                <div className="flex items-start gap-4">
                  <span className="text-[13px] font-bold text-slate-400 w-9 shrink-0 mt-1.5">차수</span>
                  <div className="flex flex-wrap gap-1.5 flex-1">
                    {COURSE.packages.map(p=>{
                      const rm = Math.max(0, p.capacity - p.enrolled);
                      const on = enrollPkg===p.id;
                      return (
                        <button key={p.id} onClick={()=>{
                            /* 차수를 바꾸면 이미 고른 인원이 새 차수와 겹칠 수 있다 — 선택을 남겨두면 막은 의미가 없다 (I15).
                               판정 대상이 바뀌는 유일한 지점이 여기라, 여기서만 걷어내면 충분하다. */
                            setEnrollPkg(p.id);
                            setSelectedMembers(prev=>{
                              const n = new Set(prev);
                              [...prev].forEach(id=>{
                                const m = STUDENT_POOL.find(x=>x.id===id);
                                if (!m) return;
                                const taken = takenSlotsOf(m);
                                if (!taken.length) return;
                                if (taken.some(t => t.pkgId === p.id)) { n.delete(id); return; }
                                if (p.sessionSelect) return;
                                const clash = (p.sessions||[]).some(ss => taken.some(t =>
                                  slotConflict({date:ss.date, start:ss.start, end:ss.end}, t)));
                                if (clash) n.delete(id);
                              });
                              return n;
                            });
                          }}
                          className={`px-3 py-1.5 rounded-lg text-[13px] font-bold transition-colors border ${on?'bg-indigo-600 text-white border-indigo-600':'bg-white text-slate-600 border-slate-200 hover:border-indigo-300'}`}>
                          {p.name} · <span className={on?'text-indigo-100':rm<=0?'text-rose-500':rm<=5?'text-amber-600':'text-emerald-600'}>{rm<=0?'마감':`잔여 ${rm}`}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>
                <div className="flex items-center justify-between pl-[52px]">
                  <span className="text-[12px] font-bold">
                    <span className="text-slate-400">잔여석 </span>
                    <span className={remain<=0?'text-rose-500':remain<=5?'text-amber-600':'text-emerald-600'}>{remain<=0?'마감':`${remain}석`}</span>
                    <span className="text-slate-400 font-medium"> / 정원 {cur?.capacity}명 (현재 {cur?.enrolled}명)</span>
                  </span>
                  {selCount>0 && (
                    <span className={`text-[12px] font-bold ${over?'text-amber-600':'text-indigo-600'}`}>{selCount}명 선택됨</span>
                  )}
                </div>
                {over && (
                  <div className="bg-amber-50 border border-amber-200 rounded-lg px-3 py-2.5 flex items-center justify-between gap-3">
                    <div className="flex items-start gap-2">
                      <AlertCircle size={14} className="text-amber-500 mt-0.5 shrink-0"/>
                      <span className="text-[12px] font-semibold text-amber-700">잔여석({remain}석)보다 {selCount-remain}명 많습니다. 정원을 늘려야 등록할 수 있습니다.</span>
                    </div>
                    <button
                      onClick={()=>{
                        /* ponytail: 프로토라 상수 COURSE 직접 갱신. 백엔드 붙으면 등록 API가 정원 상향 동반 */
                        const idx = COURSE.packages.findIndex(p=>p.id===cur.id);
                        if(idx>=0){ const ne=cur.enrolled+selCount; COURSE.packages[idx].capacity=ne; COURSE.packages[idx].enrolled=ne; }
                        resetEnroll();
                      }}
                      className="shrink-0 flex items-center gap-1.5 px-3 py-2 bg-amber-500 text-white rounded-lg text-[12px] font-bold hover:bg-amber-600 transition-colors">
                      <Plus size={13}/> 정원 {cur.enrolled+selCount}명으로 늘려 등록
                    </button>
                  </div>
                )}

                {/* 회차선택형은 이 화면에서 대상 회차가 정해지지 않아 겹침을 판정할 수 없다 — 숨기지 않고 알린다 */}
                {enrollTab==='member' && selCount>0 && cur?.sessionSelect && (
                  <div className="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 flex items-start gap-2">
                    <AlertCircle size={13} className="text-slate-400 mt-0.5 shrink-0"/>
                    <span className="text-[11px] text-slate-500 leading-relaxed">
                      <b className="text-slate-600">회차선택형 차수</b>라 학습자가 회차를 직접 고릅니다 — 등록 시점에는 일정 겹침을 판정할 수 없습니다.
                    </span>
                  </div>
                )}
              </div>

              {/* 모드 탭 (그룹은 탭이 아니라 필터로 제공) */}
              {/* 1차 개발 제외: '아이디 입력' 탭 미포함. 회원 선택 모드만 제공되어 탭 바를 숨김.
                  2차에서 아이디 입력을 되살릴 때 아래 주석을 해제하고 탭 배열에 {key:'id',label:'아이디 입력'} 추가.
              <div className="px-6 pt-3 pb-3 flex gap-1 shrink-0">
                {[{key:'member',label:'회원 선택'},{key:'id',label:'아이디 입력'}].map(t=>(
                  <button key={t.key} onClick={()=>setEnrollTab(t.key)}
                    className={`px-4 py-2 rounded-lg text-[13px] font-bold transition-colors ${enrollTab===t.key?'bg-indigo-600 text-white':'text-slate-500 hover:bg-slate-100'}`}>
                    {t.label}
                  </button>
                ))}
              </div>
              */}

              {/* ── 회원 선택 모드: 좌 테이블 + 우 선택 패널 ── */}
              {enrollTab==='member' && (
                <div className="flex-1 min-h-0 flex border-t border-slate-100">
                  {/* 좌: 필터 + 테이블 + 페이지네이션 */}
                  <div className="flex-1 min-w-0 flex flex-col border-r border-slate-100">
                    <div className="px-6 py-3 space-y-2.5 border-b border-slate-100">
                      <div className="relative">
                        <Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"/>
                        <input value={enrollSearch} onChange={e=>{setEnrollSearch(e.target.value);setEnrollPage(1);}} placeholder="이름 · 아이디 검색..."
                          className="w-full pl-9 pr-3 py-2 text-[13px] border border-slate-200 rounded-lg outline-none focus:border-indigo-400"/>
                      </div>
                      <div className="flex items-center gap-1.5 flex-wrap">
                        <span className="text-[11px] font-bold text-slate-400 flex items-center gap-1 mr-1"><Filter size={11}/> 그룹</span>
                        {ALL_GROUPS.map(g=>{
                          const on = enrollGroupFilter.has(g);
                          return (
                            <button key={g} onClick={()=>{setEnrollPage(1);setEnrollGroupFilter(prev=>{const n=new Set(prev); n.has(g)?n.delete(g):n.add(g); return n;});}}
                              className={`px-2 py-1 rounded-full text-[11px] font-semibold border transition-colors ${on?'bg-indigo-50 text-indigo-700 border-indigo-300':'bg-white text-slate-500 border-slate-200 hover:border-slate-300'}`}>
                              {g}
                            </button>
                          );
                        })}
                        {enrollGroupFilter.size>0 && (
                          <button onClick={()=>{setEnrollGroupFilter(new Set());setEnrollPage(1);}} className="px-2 py-1 text-[11px] font-semibold text-rose-500 hover:underline">필터 해제</button>
                        )}
                      </div>
                    </div>
                    <div className="px-6 py-2 flex items-center justify-between shrink-0">
                      <span className="text-[12px] text-slate-500">검색 결과 <strong className="text-slate-700 font-bold">{filtered.length}</strong>명</span>
                      {/* 전체 선택도 겹치는 회원은 건너뛴다 — 개별 클릭으로 못 고르는 걸 일괄로 담으면 막은 의미가 없다 (I15) */}
                      <button onClick={()=>setSelectedMembers(prev=>{const n=new Set(prev); allFilteredSelected?selectableIds.forEach(id=>n.delete(id)):selectableIds.forEach(id=>n.add(id)); return n;})}
                        className="text-[12px] font-bold text-indigo-600 hover:underline">{allFilteredSelected?'현재 목록 선택 해제':`현재 목록 전체 선택${blockedCount?` (겹침 ${blockedCount}명 제외)`:''}`}</button>
                    </div>
                    <div className="flex-1 overflow-y-auto custom-scrollbar px-6">
                      <table className="w-full text-[13px]">
                        <thead className="sticky top-0 bg-white z-10">
                          <tr className="text-slate-400 text-[12px] border-b border-slate-200">
                            <th className="w-9 py-2"><input type="checkbox" checked={allFilteredSelected} readOnly className="w-4 h-4 accent-indigo-600 align-middle"/></th>
                            <th className="text-left font-bold py-2">이름</th>
                            <th className="text-left font-bold py-2">아이디</th>
                            <th className="text-left font-bold py-2">그룹</th>
                            <th className="text-left font-bold py-2 w-16">권한</th>
                          </tr>
                        </thead>
                        <tbody>
                          {rows.map(s=>{
                            const sel = selectedMembers.has(s.id);
                            const cf = conflictOf(s);     // 걸리면 선택 자체를 막는다 (I15)
                            const hits = !!cf;
                            const h = cf && cf.hits && cf.hits[0];
                            const why = !cf ? null
                              : cf.reason === 'enrolled' ? '이미 이 차수에 등록된 회원입니다'
                              : `${h.busy.course} ${h.busy.sess} (${h.busy.date} ${h.busy.start}~${h.busy.end})과 겹칩니다`;
                            return (
                              <tr key={s.id} onClick={()=>{ if(!cf) toggleMember(s.id); }}
                                title={why || undefined}
                                className={`border-b border-slate-50 transition-colors ${hits?'bg-slate-50/60 cursor-not-allowed':sel?'bg-indigo-50 cursor-pointer':'hover:bg-slate-50 cursor-pointer'}`}>
                                <td className="py-2.5 text-center"><input type="checkbox" checked={sel} disabled={!!hits} readOnly className="w-4 h-4 accent-indigo-600 align-middle disabled:opacity-40"/></td>
                                <td className="py-2.5">
                                  <div className="flex items-center gap-2">
                                    <div className={`w-7 h-7 rounded-full flex items-center justify-center text-[11px] font-black shrink-0 ${hits?'bg-slate-100 text-slate-300':'bg-slate-100 text-slate-500'}`}>{s.name[0]}</div>
                                    <div className="min-w-0">
                                      <span className={`font-bold ${hits?'text-slate-400':'text-slate-800'}`}>{s.name}</span>
                                      {cf && (
                                        <div className={`text-[11px] font-semibold leading-tight mt-0.5 truncate ${cf.reason==='enrolled'?'text-slate-400':'text-rose-500'}`}>
                                          {cf.reason === 'enrolled'
                                            ? '이미 등록됨'
                                            : `일정 겹침 — ${h.busy.course} ${h.busy.sess} (${h.busy.start}~${h.busy.end})`}
                                        </div>
                                      )}
                                    </div>
                                  </div>
                                </td>
                                <td className={`py-2.5 ${hits?'text-slate-300':'text-slate-500'}`}>{s.loginId}</td>
                                <td className="py-2.5">
                                  <div className="flex flex-wrap gap-1">
                                    {s.groups.map(g=>(
                                      <span key={g} className={`px-1.5 py-0.5 rounded text-[11px] font-semibold ${hits?'bg-slate-50 text-slate-300':'bg-slate-100 text-slate-600'}`}>{g}</span>
                                    ))}
                                  </div>
                                </td>
                                <td className="py-2.5">
                                  {s.role && <span className={`px-1.5 py-0.5 rounded text-[11px] font-bold ${hits?'bg-slate-50 text-slate-300':roleBadge(s.role)}`}>{s.role}</span>}
                                </td>
                              </tr>
                            );
                          })}
                          {rows.length===0 && (
                            <tr><td colSpan={5} className="py-10 text-center text-[13px] text-slate-400">조건에 맞는 회원이 없습니다</td></tr>
                          )}
                        </tbody>
                      </table>
                    </div>
                    {totalPages>1 && (
                      <div className="px-6 py-3 border-t border-slate-100 flex items-center justify-center gap-1 shrink-0">
                        <button onClick={()=>setEnrollPage(Math.max(1,page-1))} disabled={page<=1}
                          className="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:bg-slate-100 disabled:opacity-30"><ChevronLeft size={15}/></button>
                        {Array.from({length:totalPages},(_,i)=>i+1).map(pn=>(
                          <button key={pn} onClick={()=>setEnrollPage(pn)}
                            className={`w-7 h-7 rounded-lg text-[13px] font-bold transition-colors ${pn===page?'bg-indigo-600 text-white':'text-slate-500 hover:bg-slate-100'}`}>{pn}</button>
                        ))}
                        <button onClick={()=>setEnrollPage(Math.min(totalPages,page+1))} disabled={page>=totalPages}
                          className="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:bg-slate-100 disabled:opacity-30"><ChevronRight size={15}/></button>
                      </div>
                    )}
                  </div>
                  {/* 우: 선택한 회원 */}
                  <div className="w-[250px] shrink-0 flex flex-col bg-slate-50/40">
                    <div className="px-4 py-3 flex items-center justify-between border-b border-slate-100 shrink-0">
                      <span className="text-[13px] font-bold text-slate-700">선택한 회원 <span className="text-indigo-600">{selectedMembers.size}</span></span>
                      {selectedMembers.size>0 && (
                        <button onClick={()=>setSelectedMembers(new Set())} className="text-[12px] font-semibold text-slate-400 hover:text-rose-500">전체 해제</button>
                      )}
                    </div>
                    <div className="flex-1 overflow-y-auto custom-scrollbar px-3 py-2 space-y-1">
                      {selectedMembers.size===0 ? (
                        <div className="h-full flex items-center justify-center text-[12px] text-slate-300 text-center px-4">왼쪽에서 회원을<br/>선택하세요</div>
                      ) : STUDENT_POOL.filter(s=>selectedMembers.has(s.id)).map(s=>(
                        <div key={s.id} className="flex items-center gap-2 px-2 py-1.5 rounded-lg bg-white border border-slate-100">
                          <div className="w-6 h-6 rounded-full bg-indigo-100 flex items-center justify-center text-[10px] font-black text-indigo-600 shrink-0">{s.name[0]}</div>
                          <div className="flex-1 min-w-0">
                            <div className="text-[12.5px] font-bold text-slate-800 truncate">{s.name}</div>
                            <div className="text-[11px] text-slate-400 truncate">{s.loginId}</div>
                          </div>
                          <button onClick={()=>toggleMember(s.id)} className="text-slate-300 hover:text-rose-500 shrink-0"><X size={13}/></button>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* ── 아이디 입력 모드 (1차 개발 제외 — 2차 복원 시 아래 주석 해제) ──
              {enrollTab==='id' && (
                <div className="flex-1 min-h-0 overflow-y-auto custom-scrollbar px-6 py-5 border-t border-slate-100">
                  <textarea value={enrollIdText} onChange={e=>setEnrollIdText(e.target.value)}
                    placeholder="아이디(이메일)를 줄바꿈 또는 쉼표로 구분하여 입력하세요&#10;예) haeun.kim&#10;    minho.choi"
                    className="w-full border border-slate-200 rounded-xl px-3.5 py-3 text-[14px] outline-none focus:border-indigo-400 h-40 resize-none leading-relaxed"/>
                  <p className="text-[12px] text-slate-500 mt-2">현재 <strong className="text-indigo-600 font-bold">{idLines.length}</strong>건 입력됨. 등록 시 잔여석({remain}석) 내에서만 처리됩니다.</p>
                </div>
              )}
              */}

              {/* 하단 버튼 — 정원 초과 시 등록 차단(위 '정원 늘려 등록'으로 유도) */}
              <div className="flex items-center justify-between gap-3 px-6 py-4 border-t border-slate-100 shrink-0">
                <span className="text-[12px] font-semibold">
                  {over ? <span className="text-amber-600">정원 초과 — 위에서 정원을 늘려 등록하세요</span>
                    : selCount>0 ? <span className="text-slate-500"><strong className="text-indigo-600">{selCount}명</strong> 등록 예정</span>
                    : <span className="text-slate-400">등록할 대상을 선택하세요</span>}
                </span>
                <button
                  onClick={()=>{ if(!blocked) resetEnroll(); }}
                  disabled={blocked}
                  className={`flex items-center gap-1.5 px-5 py-2.5 rounded-xl text-[14px] font-bold transition-colors shrink-0
                    ${!blocked ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'bg-slate-100 text-slate-400 cursor-not-allowed'}`}>
                  <CheckCircle size={14}/> 등록
                </button>
              </div>
            </div>
          </div>
          );
        })()}

        {/* ══ 선택 삭제 플로팅 바 (A3-39) ══
            차수가 여러 개면 표가 화면보다 길어 상단 툴바는 스크롤 밖으로 밀린다. 체크는 아래에서 하고
            버튼은 위에 있는 구조를 만들지 않기 위해, 선택이 생기면 액션이 화면에 따라붙는다.
            선택이 없으면 존재하지 않는다 — 가장 위험한 버튼을 상시 노출하지 않는다. */}
        {tab==='roster' && delSel.size>0 && !delModal && (
          <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 flex items-center gap-3 pl-5 pr-3 py-3 bg-slate-900 rounded-2xl shadow-2xl animate-slideUp" data-feature-id="A3-39">
            <span className="text-[13px] font-bold text-white">{delSel.size}명 선택</span>
            <button onClick={()=>setDelSel(new Set())} className="text-[12px] font-bold text-slate-400 hover:text-white transition-colors">선택 해제</button>
            <button onClick={()=>openDelModal([...delSel])}
              className="flex items-center gap-1.5 px-4 py-2 bg-rose-500 text-white rounded-xl text-[13px] font-bold hover:bg-rose-600 transition-colors">
              <Trash2 size={13}/> 삭제
            </button>
          </div>
        )}

        {/* ══ 수강생 삭제 확인 모달 (A3-38·A3-39) ══
            코스 삭제 다이얼로그와 같은 골격: 사라지는 것 / 남는 것을 먼저 보여주고 마지막에 확인.
            다만 확인 강도는 잃는 양에 비례한다 — 출결 이력이 없으면 버튼 한 번, 있으면 "삭제" 입력까지. */}
        {delModal && (() => {
          const targets = delTargets(delModal.ids);
          const many = targets.length > 1;
          const attnTotal = targets.reduce((a,t)=>a+t.attn,0);
          const studyTotal = targets.reduce((a,t)=>a+t.study,0);
          const doneCount = targets.filter(t=>t.done).length;   // 수료 확정자 — 가장 무거운 삭제
          const needText = attnTotal > 0 || doneCount > 0;      // 지울 이력이 있을 때만 텍스트 확인
          const ok = targets.length>0 && (!needText || delConfirmText.trim()==='삭제');
          return (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[120] p-4" onClick={closeDelModal}>
              <div className="bg-white rounded-2xl shadow-xl w-[460px] max-h-[88vh] flex flex-col animate-slideUp" onClick={e=>e.stopPropagation()}>
                <div className="px-6 pt-6 pb-4 text-center shrink-0">
                  <div className="w-12 h-12 rounded-full bg-rose-50 border border-rose-100 flex items-center justify-center mx-auto mb-3">
                    <Trash2 size={20} className="text-rose-500"/>
                  </div>
                  <div className="text-[17px] font-black text-slate-900">수강생을 삭제하시겠습니까?</div>
                  <p className="text-[13px] text-slate-500 mt-1.5 leading-relaxed">
                    이 차수의 수강 등록과 등록에 딸린 기록이 함께 삭제되며,<br/>삭제 후에는 복구할 수 없습니다.
                  </p>
                </div>

                <div className="flex-1 min-h-0 overflow-y-auto custom-scrollbar px-6 space-y-3">
                  {/* 대상 */}
                  <div className="bg-rose-50/70 border border-rose-100 rounded-xl px-4 py-3">
                    <div className="text-[11px] font-bold text-rose-400 mb-1.5">삭제할 수강생 {many?`${targets.length}명`:''}</div>
                    <div className="space-y-1 max-h-[132px] overflow-y-auto custom-scrollbar">
                      {/* 아이디를 함께 박는다 — 동명이인을 이름만 보고 지우는 사고를 막는 유일한 단서 */}
                      {targets.map(t=>(
                        <div key={t.id} className="flex items-center gap-2 text-[13px]">
                          <span className="font-bold text-slate-800 shrink-0">{t.name}</span>
                          <span className="text-[11px] text-slate-500 font-mono bg-white border border-rose-100 px-1.5 py-0.5 rounded shrink-0">{t.loginId}</span>
                          <span className="text-slate-400 text-[12px] shrink-0">{t.dept}</span>
                          <span className="text-slate-300">·</span>
                          <span className="text-slate-500 text-[12px] font-semibold truncate">{t.pkg?.name}</span>
                          {t.done && <span className="shrink-0 text-[10px] font-bold text-emerald-600 bg-emerald-50 border border-emerald-200 px-1.5 py-0.5 rounded-full">수료</span>}
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* 수료 확정자 경고 — 가장 무거운 삭제. 막지는 않되 무엇이 사라지는지 분명히 말한다 */}
                  {doneCount>0 && (
                    <div className="bg-rose-50 border border-rose-200 rounded-xl px-4 py-3 flex items-start gap-2">
                      <AlertTriangle size={14} className="text-rose-500 mt-0.5 shrink-0"/>
                      <div className="text-[12px] font-semibold text-rose-700 leading-relaxed">
                        <strong className="font-black">수료 확정 {doneCount}명</strong>이 포함되어 있습니다.
                        수료 기록이 함께 삭제되어 <strong className="font-black">수료증 발급·법정의무교육 이수 증빙의 근거가 사라집니다.</strong><br/>
                        <span className="font-medium text-rose-600">대상이 맞는지 위 명단을 다시 확인하세요.</span>
                      </div>
                    </div>
                  )}

                  {/* 이력 경고 — 실제로 지워지는 양을 숫자로 보여준다 */}
                  {attnTotal>0 && (
                    <div className="bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 flex items-start gap-2">
                      <AlertTriangle size={14} className="text-amber-500 mt-0.5 shrink-0"/>
                      <div className="text-[12px] font-semibold text-amber-700 leading-relaxed">
                        출결 기록 <strong className="font-black">{attnTotal}건</strong>
                        {studyTotal>0 && <> · 학습시간 <strong className="font-black">{fmtDuration(studyTotal)}</strong></>}
                        이 함께 삭제됩니다.<br/>
                        <span className="font-medium text-amber-600">출석률·수료율·평균 학습시간이 삭제 인원을 뺀 값으로 재계산됩니다.</span>
                      </div>
                    </div>
                  )}

                  {/* 사라지는 것 / 남는 것 */}
                  <div className="grid grid-cols-2 gap-2.5">
                    <div className="border border-slate-200 rounded-xl px-3.5 py-3">
                      <div className="text-[11px] font-black text-rose-500 mb-1.5">삭제됩니다</div>
                      <ul className="text-[12px] text-slate-600 space-y-1 leading-relaxed">
                        <li>· 이 차수의 수강 등록</li>
                        <li>· 회차별 출결 · 인정 시각</li>
                        <li>· 조퇴 · 결석 사유</li>
                        <li>· 누적 학습시간 · 수료 판정</li>
                      </ul>
                    </div>
                    <div className="border border-slate-200 rounded-xl px-3.5 py-3 bg-slate-50/60">
                      <div className="text-[11px] font-black text-slate-400 mb-1.5">유지됩니다</div>
                      <ul className="text-[12px] text-slate-500 space-y-1 leading-relaxed">
                        <li>· 회원 계정</li>
                        <li>· 다른 코스 · 차수 수강 이력</li>
                        <li>· 차수 정원 (자리는 재등록에 사용)</li>
                        <li>· 회차 일정 · 장소</li>
                      </ul>
                    </div>
                  </div>

                  {/* 텍스트 확인 — 출결 이력이 있을 때만 */}
                  {needText && (
                    <div>
                      <div className="text-[12px] font-bold text-slate-500 mb-1.5">계속하려면 <span className="text-rose-500">삭제</span>를 입력하세요.</div>
                      {/* autoFocus 없음 — 스크롤 컨테이너 안이라 포커스가 뒤 목록을 끌어당겨 위치를 잃게 만든다 */}
                      <input value={delConfirmText} onChange={e=>setDelConfirmText(e.target.value)} placeholder="삭제"
                        className="w-full border border-slate-200 rounded-lg px-3 py-2 text-[14px] outline-none focus:border-rose-400"/>
                    </div>
                  )}
                </div>

                <div className="flex items-center gap-2 px-6 py-4 shrink-0">
                  <button onClick={closeDelModal}
                    className="flex-1 py-2.5 rounded-xl border border-slate-200 text-[14px] font-bold text-slate-600 hover:bg-slate-50 transition-colors">취소</button>
                  <button onClick={()=>{ if(ok) deleteLearners(targets.map(t=>t.id)); }} disabled={!ok}
                    className={`flex-1 py-2.5 rounded-xl text-[14px] font-bold transition-colors ${ok?'bg-rose-600 text-white hover:bg-rose-700':'bg-slate-100 text-slate-400 cursor-not-allowed'}`}>
                    삭제
                  </button>
                </div>
              </div>
            </div>
          );
        })()}

        {/* ══ 그룹별 수료 현황 모달 (페이지네이션 10/page) ══ */}
        {deptModalOpen && (() => {
          const PER = 10;
          const totalPages = Math.max(1, Math.ceil(deptStats.length / PER));
          const page = Math.min(deptPage, totalPages);
          const rows = deptStats.slice((page-1)*PER, page*PER);
          return (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50" onClick={()=>setDeptModalOpen(false)}>
              <div className="bg-white rounded-2xl shadow-xl w-[680px] max-h-[82vh] flex flex-col animate-slideUp" onClick={e=>e.stopPropagation()}>
                <div className="flex items-center justify-between px-6 pt-5 pb-3 border-b border-slate-100">
                  <div className="text-[17px] font-black text-slate-900">그룹별 수료 현황</div>
                  <button onClick={()=>setDeptModalOpen(false)} className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-400"><X size={16}/></button>
                </div>
                <div className="px-6 py-3 text-[13px] text-slate-500">총 <strong className="text-slate-700 font-bold">{deptStats.length}</strong>개 그룹</div>
                <div className="flex-1 overflow-y-auto custom-scrollbar px-6">
                  <table className="w-full text-[13px]">
                    <thead className="sticky top-0 bg-white">
                      <tr className="text-slate-400 text-[12px] border-b border-slate-200">
                        <th className="text-left font-bold py-2">그룹</th>
                        <th className="text-center font-bold py-2 w-24">수강 인원</th>
                        <th className="text-center font-bold py-2 w-20">수료</th>
                        <th className="text-left font-bold py-2 w-44">수료율</th>
                      </tr>
                    </thead>
                    <tbody>
                      {rows.map((d,i)=>{
                        const rate = d.count>0 ? Math.round(d.completed/d.count*100) : 0;
                        return (
                          <tr key={i} className="border-b border-slate-50">
                            <td className="py-2.5 font-semibold text-slate-700">{d.dept}</td>
                            <td className="py-2.5 text-center text-slate-500">{d.count}명</td>
                            <td className={`py-2.5 text-center font-bold ${d.completed===0?'text-slate-400':'text-emerald-600'}`}>{d.completed}</td>
                            <td className="py-2.5">
                              <div className="flex items-center gap-2">
                                <div className="flex-1 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                  <div className={`h-full rounded-full ${rate>=60?'bg-emerald-400':rate>0?'bg-amber-400':'bg-slate-200'}`} style={{width:`${rate}%`}}/>
                                </div>
                                <span className="text-[12px] font-bold text-slate-500 w-9 text-right">{rate}%</span>
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
                <div className="flex items-center justify-center gap-1 px-6 py-4 border-t border-slate-100">
                  <button disabled={page<=1} onClick={()=>setDeptPage(page-1)} className="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:bg-slate-100 disabled:opacity-30 disabled:hover:bg-transparent"><ChevronLeft size={16}/></button>
                  {Array.from({length:totalPages},(_,n)=>n+1).map(n=>(
                    <button key={n} onClick={()=>setDeptPage(n)} className={`w-8 h-8 rounded-lg text-[13px] font-bold transition-colors ${n===page?'bg-indigo-600 text-white':'text-slate-500 hover:bg-slate-100'}`}>{n}</button>
                  ))}
                  <button disabled={page>=totalPages} onClick={()=>setDeptPage(page+1)} className="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:bg-slate-100 disabled:opacity-30 disabled:hover:bg-transparent"><ChevronRight size={16}/></button>
                </div>
              </div>
            </div>
          );
        })()}

        {/* ══ 회차 상세 팝오버 ══ */}
        {calPopover && (
          <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50" onClick={()=>setCalPopover(null)}>
            <div className="bg-white rounded-2xl shadow-xl w-[360px] animate-slideUp" onClick={e=>e.stopPropagation()}>
              <div className="flex items-start justify-between px-5 py-4 border-b border-slate-100">
                <div>
                  <div className="text-[15px] font-black text-slate-900">{calPopover.pkgName}</div>
                  <div className="text-[14px] font-bold text-indigo-600 mt-0.5">{calPopover.name}</div>
                  <div className="flex items-center gap-2 mt-1.5 text-[12px] text-slate-400">
                    <span className="flex items-center gap-1"><Calendar size={10}/>{fmtDate(calPopover.date)}</span>
                    <span>·</span>
                    <span>{calPopover.start}~{calPopover.end}</span>
                    <span>·</span>
                    <span className="flex items-center gap-1"><MapPin size={10}/>{calPopover.place}</span>
                  </div>
                </div>
                <button onClick={()=>setCalPopover(null)}
                  className="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-400 transition-colors shrink-0">
                  <X size={14}/>
                </button>
              </div>
              <div className="p-5">
                <div className="grid grid-cols-4 gap-2 mb-4">
                  {[
                    {label:'출석', val:calPopover.att,     color:'text-emerald-600', bg:'bg-emerald-50'},
                    {label:'지각', val:calPopover.late,    color:'text-amber-500',   bg:'bg-amber-50'},
                    {label:'결석', val:calPopover.abs,     color:'text-red-500',     bg:'bg-rose-50'},
                    {label:'미확인', val:calPopover.pending, color:'text-slate-400', bg:'bg-slate-50'},
                  ].map(s=>(
                    <div key={s.label} className={`${s.bg} rounded-xl p-3 text-center`}>
                      <div className={`text-[22px] font-black ${s.color} leading-none`}>{s.val}</div>
                      <div className={`text-[11px] font-bold ${s.color} mt-1`}>{s.label}</div>
                    </div>
                  ))}
                </div>
                <div className="flex gap-2">
                  {(calPopover.date === TODAY || ATT_MODE==='fixed') && (
                    <button onClick={()=>{
                        const cp = COURSE.packages.find(p=>p.id===calPopover.pkgId);
                        setCalPopover(null); openAttendanceQr(cp);
                      }}
                      className="flex-1 flex items-center justify-center gap-1.5 px-4 py-2.5 bg-indigo-500 text-white rounded-xl text-[14px] font-bold hover:bg-indigo-600 transition-colors shadow-sm">
                      <QrCode size={14}/> {attQrLabel}
                    </button>
                  )}
                  <button onClick={()=>{setTab('attendance');setOpenPkgs(prev=>new Set([...prev,calPopover.pkgId]));setCalPopover(null);}}
                    className="flex-1 flex items-center justify-center gap-1.5 px-4 py-2.5 bg-slate-100 text-slate-700 rounded-xl text-[14px] font-bold hover:bg-slate-200 transition-colors">
                    <CheckSquare size={14}/> 출석탭에서 보기
                  </button>
                </div>
              </div>
            </div>
          </div>
        )}
        {/* ── 출석 QR 모달 (고정 모드, A3-34·A3-35) ──
            코스 단위로 열고 전체 차수의 회차를 차수별로 묶어 보여준다(I8) ·
            회차당 발급(I1) · 토큰 동결(D3) · 입퇴장 쌍 재발급(F11) · 라벨 인쇄(F9 개정) · 파일명에 회차(I5) */}
        {qrModal && (()=>{
          const PKGS = COURSE.packages;
          const scope = qrModal.pkgId;
          const shownPkgs = scope === 'all' ? PKGS : PKGS.filter(p=>p.id === scope);
          const shownSessCnt = shownPkgs.reduce((n,p)=>n + p.sessions.length, 0);
          const sheetCnt = shownSessCnt * (CHECKOUT_ON ? 2 : 1);
          return (
            <div className="fixed inset-0 bg-slate-900/50 z-[60] flex items-center justify-center p-6 animate-fadeIn" onClick={closeQrModal}>
              {/* 폭은 QR 장수가 정한다 — 부착 체크 문단이 빠진 뒤로 넓은 폭은 오른쪽 여백만 남았다 (2026-08-11) */}
              <div className={`bg-white rounded-2xl shadow-2xl w-full max-h-[92vh] flex flex-col overflow-hidden ${CHECKOUT_ON ? 'max-w-[520px]' : 'max-w-[420px]'}`} onClick={e=>e.stopPropagation()}>
                {/* 헤더 — 단위는 코스. 차수는 그 아래 범위 표시로 내려간다 */}
                <div className="px-6 py-4 bg-slate-900 flex items-start gap-3 shrink-0">
                  <QrCode size={18} className="text-indigo-400 shrink-0 mt-0.5"/>
                  <div className="flex-1 min-w-0">
                    <div className="text-[15px] font-black text-white truncate">{COURSE.title} · 출석 QR</div>
                    <div className="text-[12px] text-slate-400 mt-0.5">
                      {scope === 'all' ? `전체 ${PKGS.length}개 차수` : shownPkgs[0].name} · {shownSessCnt}회차 · 인쇄물 {sheetCnt}장
                    </div>
                  </div>
                  <button onClick={closeQrModal} className="text-slate-400 hover:text-white transition-colors shrink-0"><X size={18}/></button>
                </div>

                {/* 차수 범위 — 기본은 전체. 한 차수만 뽑을 때 좁힌다 (I8) */}
                {PKGS.length > 1 && (
                  <div className="px-6 py-2.5 bg-slate-800 border-b border-slate-700 flex items-center gap-1.5 overflow-x-auto shrink-0">
                    <span className="text-[11px] font-bold text-slate-500 shrink-0 mr-0.5">차수</span>
                    <button onClick={()=>setQrScope('all')}
                      className={`shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-bold transition-colors ${scope==='all'
                        ? 'bg-indigo-500 text-white' : 'bg-slate-700/60 text-slate-300 hover:bg-slate-700'}`}>
                      전체 {PKGS.length}개 차수
                    </button>
                    {PKGS.map(p=>(
                      <button key={p.id} onClick={()=>setQrScope(p.id)}
                        className={`shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-bold transition-colors ${scope===p.id
                          ? 'bg-indigo-500 text-white' : 'bg-slate-700/60 text-slate-300 hover:bg-slate-700'}`}>
                        {p.name} · {p.sessions.length}회차
                      </button>
                    ))}
                  </div>
                )}

                {/* 차수 → 회차 목록 — 회차마다 입장(·퇴장) QR */}
                <div className="flex-1 min-h-0 overflow-y-auto">
                  {shownPkgs.map(pkg=>(
                    <div key={pkg.id}>
                      {/* 차수 구분 — 스크롤 중에도 지금 보는 QR이 어느 차수 것인지 잃지 않게 sticky */}
                      <div className="sticky top-0 z-10 px-6 py-2.5 bg-slate-100/95 backdrop-blur border-y border-slate-200 flex items-center gap-2">
                        <Layers size={12} className="text-slate-400 shrink-0"/>
                        <span className="text-[12px] font-black text-slate-700 shrink-0">{pkg.name}</span>
                        <span className="flex-1 min-w-0 text-[11px] text-slate-400 truncate">{pkg.place} · {pkg.sessions.length}회차 · 신청 {pkg.enrolled}명</span>
                      </div>
                      <div className="divide-y divide-slate-100">
                        {pkg.sessions.map(s=>{
                          const q = qrInfoOf(pkg, s);
                          const studyLabel = fmtDuration(sessionStudyMin(s));
                          const rk = qrKey(pkg.id, s.id);
                          const cards = [
                            { kind:'입장', token:q.tokenIn,  tone:'indigo' },
                            ...(CHECKOUT_ON ? [{ kind:'퇴장', token:q.tokenOut, tone:'orange' }] : []),
                          ];
                          // 미리보기·PNG·SVG가 같은 구성을 쓰도록 시트를 한 곳에서 만든다 (ZIP도 같은 필드)
                          const sheetOf = (c) => ({ token:c.token, sessName:s.name, studyLabel,
                                                    placeLabel: effPlace(pkg, s), issuedAt: q.issuedAt, kind:c.kind });
                          return (
                            <div key={rk} className="px-6 py-5">
                              <div className="flex items-center gap-2 mb-3.5">
                                <div className="flex-1 min-w-0">
                                  <div className="text-[14px] font-black text-slate-800 truncate">{s.name}</div>
                                  <div className="text-[12px] text-slate-400 tabular-nums mt-0.5">{s.date} · {s.start}~{s.end} · 학습 {studyLabel}</div>
                                </div>
                                <span className="text-[11px] text-slate-400 tabular-nums shrink-0">
                                  {q.issuedAt} 발급{q.rev>1 && ` · ${q.rev}차`}
                                </span>
                                <button onClick={()=>setQrConfirmReissue(qrConfirmReissue === rk ? null : rk)}
                                  className="shrink-0 flex items-center gap-1 px-2.5 py-1 bg-white border border-slate-300 text-slate-600 rounded-lg text-[11px] font-bold hover:bg-slate-100 transition-colors">
                                  <RefreshCw size={11}/> 재발급
                                </button>
                              </div>

                              {qrConfirmReissue === rk && (
                                <div className="mb-3.5 bg-rose-50 border border-rose-200 rounded-xl px-3.5 py-2.5 flex items-start gap-2 animate-fadeIn">
                                  <AlertTriangle size={13} className="text-rose-500 shrink-0 mt-0.5"/>
                                  <p className="flex-1 text-[11px] text-rose-600 leading-relaxed">
                                    <span className="font-bold">{pkg.name} · {s.name}</span>에 게시한 QR이 <span className="font-bold">즉시 무효화</span>됩니다.
                                    {CHECKOUT_ON ? ' 입장·퇴장이 함께 교체되므로 둘 다 다시 내려받아 교체하세요.' : ' 새 QR을 다시 내려받아 교체하세요.'}
                                  </p>
                                  <div className="flex items-center gap-1.5 shrink-0">
                                    <button onClick={()=>reissueQr(pkg, s)}
                                      className="px-2.5 py-1 bg-rose-500 text-white rounded-lg text-[11px] font-bold hover:bg-rose-600 transition-colors">정말 재발급</button>
                                    <button onClick={()=>setQrConfirmReissue(null)}
                                      className="px-2.5 py-1 bg-white border border-slate-300 text-slate-600 rounded-lg text-[11px] font-bold hover:bg-slate-100 transition-colors">취소</button>
                                  </div>
                                </div>
                              )}

                              {/* 카드는 남는 폭을 나눠 갖는다 — 고정 폭으로 두면 오른쪽에 빈 자리가 생긴다 */}
                              <div className="flex items-start justify-center gap-4">
                                {cards.map(c=>(
                                  <div key={c.kind} className="flex flex-col items-center gap-2 flex-1 min-w-0 max-w-[240px]">
                                    <span className={`text-[11px] font-black px-2 py-0.5 rounded-full border ${c.tone==='indigo'
                                      ? 'text-indigo-600 bg-indigo-50 border-indigo-200' : 'text-orange-600 bg-orange-50 border-orange-200'}`}>{c.kind}</span>
                                    <QrBox sheet={sheetOf(c)} px={6} width="100%"/>
                                    {/* PNG는 그대로 쓰는 용, SVG는 라벨지·A4로 확대해 인쇄하는 용 — 둘 다 같은 구성 */}
                                    <div className="w-full grid grid-cols-2 gap-1.5">
                                      <button onClick={()=>downloadQr(sheetOf(c), qrFileName(pkg.name, s.name, c.kind, q.issuedAt, 'png'))}
                                        className="flex items-center justify-center gap-1 px-2 py-1.5 bg-slate-800 text-white rounded-lg text-[11px] font-bold hover:bg-slate-700 transition-colors">
                                        <Download size={11}/> PNG
                                      </button>
                                      <button onClick={()=>downloadQrSvg(sheetOf(c), qrFileName(pkg.name, s.name, c.kind, q.issuedAt, 'svg'))}
                                        className="flex items-center justify-center gap-1 px-2 py-1.5 bg-white border border-slate-300 text-slate-700 rounded-lg text-[11px] font-bold hover:bg-slate-50 transition-colors">
                                        <Download size={11}/> SVG
                                      </button>
                                    </div>
                                    <div className="text-[10px] text-slate-400 break-all leading-snug text-center">
                                      {qrFileBase(pkg.name, s.name, c.kind, q.issuedAt)}<span className="text-slate-300">.png / .svg</span>
                                    </div>
                                  </div>
                                ))}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>

                {/* 푸터 — 지금 보고 있는 범위를 ZIP 하나로. 버튼은 하나, 나머지는 설명 */}
                <div className="px-6 py-3 bg-slate-50 border-t border-slate-200 shrink-0 flex items-center gap-3">
                  <div className="flex-1 min-w-0 text-[11px] text-slate-400 leading-snug">
                    {qrBulk
                      ? <span className="text-indigo-600 font-bold">
                          ZIP 만드는 중 — {qrBulk.done}/{qrBulk.total}장
                          {qrBulk.done === qrBulk.total && ' · 저장됩니다'}
                        </span>
                      : <>
                          <span className="font-bold text-slate-500">{scope==='all' ? `전체 ${PKGS.length}개 차수` : shownPkgs[0].name}</span>
                          {' '}· 회차 {shownSessCnt}개 · QR {sheetCnt}장. 차수별 폴더로 나뉘고 PNG·SVG가 함께 들어갑니다.
                          {!CHECKOUT_ON && ' 퇴장 체크는 코스 빌더 > 수료 조건 > 출석 판정 기준에서 켜세요.'}
                        </>}
                  </div>
                  <button data-feature-id="A3-47" disabled={!!qrBulk} onClick={()=>downloadQrZip(shownPkgs, scope==='all' ? '전체차수' : shownPkgs[0].name)}
                    className="shrink-0 flex items-center gap-1.5 px-4 py-2 bg-slate-800 text-white rounded-lg text-[12px] font-bold hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
                    <Download size={12}/> {qrBulk ? '만드는 중…' : `전체 다운로드 (ZIP · ${sheetCnt}장)`}
                  </button>
                </div>
              </div>
            </div>
          );
        })()}

        {/* ── 출석 명단 모달 ── */}
        {attModal && (()=>{
          const {pkg:mp,session:ms,pkgL:mL}=attModal;
          const FILTERS=[
            {key:'all',label:'전체'},
            {key:'att',label:'출석·지각'},
            {key:'absent',label:'결석'},
            {key:'pending',label:'미확인'},
          ];
          const filtered=mL.filter(l=>{
            const st=attendanceMap[`${l.id}_${ms.id}`]||'pending';
            const matchFilter=
              modalFilter==='all'||
              (modalFilter==='att'&&['attended','late','early_leave'].includes(st))||
              (modalFilter==='absent'&&st==='absent')||
              (modalFilter==='pending'&&st==='pending');
            const matchSearch=!modalSearch||l.name.includes(modalSearch)||(l.loginId||'').toLowerCase().includes(modalSearch.toLowerCase());
            return matchFilter&&matchSearch;
          });
          return (
            <div className="fixed inset-0 z-[300] flex items-center justify-center bg-black/40 animate-fadeIn"
              onClick={()=>setAttModal(null)}>
              <div className="bg-white rounded-2xl shadow-2xl w-[600px] max-h-[80vh] flex flex-col animate-modalFade"
                onClick={e=>e.stopPropagation()}>
                <div className="flex items-center justify-between px-5 py-4 border-b border-slate-100">
                  <div>
                    <div className="text-[15px] font-bold text-slate-800">
                      {ms.label||`${ms.date.slice(5).replace('-','/')} 회차`} 출석 명단
                    </div>
                    <div className="text-[13px] text-slate-400 mt-0.5">{mp.name} · 총 {mL.length}명 · {ms.start}~{ms.end}</div>
                  </div>
                  <button onClick={()=>setAttModal(null)} className="w-7 h-7 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-400 transition-colors">
                    <X size={15}/>
                  </button>
                </div>
                <div className="px-5 pt-3 pb-2 flex items-center gap-3 border-b border-slate-100">
                  <div className="flex gap-1">
                    {FILTERS.map(f=>{
                      const cnt=f.key==='all'?mL.length:mL.filter(l=>{
                        const st=attendanceMap[`${l.id}_${ms.id}`]||'pending';
                        return (f.key==='att'&&['attended','late','early_leave'].includes(st))||(f.key==='absent'&&st==='absent')||(f.key==='pending'&&st==='pending');
                      }).length;
                      return (
                        <button key={f.key} onClick={()=>setModalFilter(f.key)}
                          className={`px-3 py-1 rounded-lg text-[13px] font-bold transition-colors ${modalFilter===f.key?'bg-indigo-600 text-white':'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>
                          {f.label} <span className="opacity-70">{cnt}</span>
                        </button>
                      );
                    })}
                  </div>
                  <div className="flex-1">
                    <input value={modalSearch} onChange={e=>setModalSearch(e.target.value)}
                      placeholder="이름·아이디 검색..."
                      className="w-full px-3 py-1.5 text-[13px] border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-400 bg-slate-50"/>
                  </div>
                </div>
                <div className="overflow-y-auto flex-1">
                  {filtered.length===0
                    ? <div className="py-10 text-center text-[14px] text-slate-300">해당 조건의 수강생이 없습니다</div>
                    : <table className="w-full text-[13px]">
                        <thead className="bg-slate-50 sticky top-0">
                          <tr>
                            <th className="px-4 py-2.5 text-left font-bold text-slate-500 text-[12px]">이름</th>
                            <th className="px-4 py-2.5 text-center font-bold text-slate-500 text-[12px]">상태</th>
                            <th className="px-4 py-2.5 text-center font-bold text-slate-500 text-[12px]">QR 스캔</th>
                            <th className="px-4 py-2.5 text-center font-bold text-slate-500 text-[12px]">관리자 인정</th>
                            <th className="px-4 py-2.5 text-center font-bold text-slate-500 text-[12px]">변경</th>
                          </tr>
                        </thead>
                        <tbody>
                          {filtered.map((l,li)=>{
                            const key=`${l.id}_${ms.id}`;
                            const st=attendanceMap[key]||'pending';
                            const cfg=ATT_CFG[st];
                            const scanTs=scanTimeMap[key];
                            const manTs=tsMap[key];
                            const isDDOpen=openDropdown===`modal_${key}`;
                            const reason=reasonMap[key];
                            const canReason=st==='early_leave'||st==='absent';
                            return (
                              <tr key={l.id} className={`border-t border-slate-100 hover:bg-slate-50 transition-colors ${li%2===0?'bg-white':'bg-slate-50/30'}`}>
                                <td className="px-4 py-2.5">
                                  <div className="font-bold text-slate-700">{l.name}</div>
                                  <div className="text-[11px] text-slate-400 font-mono">{l.loginId}</div>
                                </td>
                                <td className="px-4 py-2.5 text-center">
                                  <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-[12px] font-bold ${cfg.bg} ${cfg.color} ${cfg.border} border`}>
                                    {cfg.label}
                                  </span>
                                  {reason && (
                                    <div className="mt-0.5 text-[11px] text-orange-600 font-medium flex items-center justify-center gap-0.5" title={`사유: ${reason}`}>
                                      사유: {reason}
                                    </div>
                                  )}
                                </td>
                                <td className="px-4 py-2.5 text-center text-[12px] font-mono text-slate-500">
                                  {scanTs?<span className="flex items-center justify-center gap-1"><QrCode size={9} className="text-indigo-400"/>{scanTs.slice(11,16)}</span>:<span className="text-slate-200">—</span>}
                                </td>
                                <td className="px-4 py-2.5 text-center text-[12px] font-mono text-slate-500">
                                  {manTs?<span className="flex items-center justify-center gap-1"><Pencil size={9}/>{manTs.slice(11,16)}</span>:<span className="text-slate-200">—</span>}
                                </td>
                                <td className="px-4 py-2.5 text-center">
                                  <div className="inline-block">
                                    <button onClick={e=>toggleDD(`modal_${key}`,e)}
                                      className={`px-2.5 py-1 rounded-lg border text-[12px] font-bold transition-colors ${cfg.bg} ${cfg.color} ${cfg.border} hover:opacity-75`}>
                                      변경 <ChevronDown size={9} className="inline"/>
                                    </button>
                                    {isDDOpen && (
                                      <div className="fixed z-[400] bg-white border border-slate-200 rounded-xl shadow-lg overflow-hidden w-[210px] animate-fadeIn"
                                        onClick={e=>e.stopPropagation()}
                                        style={{left:dropdownPos.x,top:dropdownPos.y}}>
                                        {['attended','late','early_leave','absent'].map(opt=>(
                                          <button key={opt}
                                            onClick={()=>{recordAttendance(l.id,ms.id,opt,mp.id,l.name); if(opt!=='early_leave'&&opt!=='absent') setOpenDropdown(null);}}
                                            className={`w-full flex items-center gap-2 px-3 py-2 text-[13px] font-bold text-left transition-colors ${st===opt?`${ATT_CFG[opt].bg} ${ATT_CFG[opt].color}`:'text-slate-600 hover:bg-slate-50'}`}>
                                            {st===opt?<CheckCircle size={11} className="shrink-0"/>:<span className="w-[11px] shrink-0 inline-block"/>}
                                            {ATT_CFG[opt].label}
                                          </button>
                                        ))}
                                        <div className="my-1 border-t border-slate-100"/>
                                        <button onClick={()=>{recordAttendance(l.id,ms.id,'pending',mp.id,l.name);setOpenDropdown(null);}}
                                          className="w-full flex items-center gap-2 px-3 py-2 text-[12px] text-slate-400 hover:bg-slate-50 text-left transition-colors">
                                          <span className="w-[11px] shrink-0 inline-block"/>미확인으로
                                        </button>
                                        {canReason && (
                                          <div className="border-t border-slate-100 px-3 py-2.5 bg-orange-50/40">
                                            <div className="text-[11px] font-bold text-orange-700 mb-1.5 flex items-center gap-1">
                                              사유 (선택)
                                            </div>
                                            <div className="flex flex-wrap gap-1 mb-1.5">
                                              {REASON_PRESETS.map(r=>(
                                                <button key={r} onClick={()=>setAttReason(l.id,ms.id,r)}
                                                  className={`px-2 py-0.5 rounded-md text-[11px] font-bold border transition-colors ${reason===r?'bg-orange-500 text-white border-orange-500':'bg-white text-slate-600 border-slate-200 hover:border-orange-300'}`}>
                                                  {r}
                                                </button>
                                              ))}
                                            </div>
                                            <input type="text" value={reason||''} onChange={e=>setAttReason(l.id,ms.id,e.target.value)}
                                              placeholder="사유 직접 입력"
                                              className="w-full border border-slate-200 rounded-md px-2 py-1 text-[12px] focus:border-orange-400 outline-none"/>
                                            <button onClick={()=>setOpenDropdown(null)}
                                              className="w-full mt-1.5 py-1 bg-slate-800 hover:bg-slate-900 text-white rounded-md text-[11px] font-bold">완료</button>
                                          </div>
                                        )}
                                      </div>
                                    )}
                                  </div>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                  }
                </div>
              </div>
            </div>
          );
        })()}
        </div>

        {/* ══ 코스 만들기 모달 (코스v2 진입) ══ */}
        {showCreateModal && (
          <div
            className="fixed inset-0 z-[100] bg-slate-900/40 flex items-center justify-center p-6"
            onClick={() => setShowCreateModal(false)}
          >
            <div
              className="bg-[#f7f9fc] rounded-3xl shadow-2xl w-[1100px] max-w-[95vw] max-h-[92vh] overflow-y-auto p-12 relative"
              onClick={e => e.stopPropagation()}
            >
              <button
                onClick={() => setShowCreateModal(false)}
                className="absolute top-5 right-5 w-9 h-9 rounded-full flex items-center justify-center text-slate-400 hover:bg-slate-100 hover:text-slate-700 transition-colors"
                aria-label="닫기"
              >
                <X size={18}/>
              </button>

              <h1 className="text-[34px] font-black text-center text-slate-900 mb-14">어떤 코스를 개설하시겠어요?</h1>

              <div className="grid grid-cols-3 gap-6 max-w-[1000px] mx-auto">
                <button
                  onClick={() => goBuilder('online')}
                  className="group text-left bg-white rounded-2xl p-7 border border-slate-200 hover:border-indigo-300 hover:shadow-lg transition-all relative overflow-hidden"
                >
                  <div className="w-14 h-14 rounded-xl bg-indigo-50 flex items-center justify-center mb-5">
                    <Monitor size={26} className="text-indigo-600"/>
                  </div>
                  <h3 className="text-[19px] font-black text-slate-900 mb-2.5">온라인 코스</h3>
                  <p className="text-[14.5px] text-slate-500 leading-relaxed mb-5">
                    비대면·자기주도 학습 과정을 설계합니다.<br/>VOD, 문서, 시험을 자유롭게 조합하세요.
                  </p>
                  <div className="flex flex-wrap gap-1.5">
                    <span className="px-2.5 py-1 bg-slate-100 text-slate-600 text-[12px] font-semibold rounded">VOD</span>
                    <span className="px-2.5 py-1 bg-slate-100 text-slate-600 text-[12px] font-semibold rounded">문서</span>
                    <span className="px-2.5 py-1 bg-slate-100 text-slate-600 text-[12px] font-semibold rounded">시험/퀴즈</span>
                  </div>
                </button>

                <button
                  onClick={() => goBuilder('offline')}
                  className="group text-left bg-white rounded-2xl p-7 border border-slate-200 hover:border-rose-300 hover:shadow-lg transition-all relative overflow-hidden"
                >
                  <div className="w-14 h-14 rounded-xl bg-rose-50 flex items-center justify-center mb-5">
                    <MapPin size={26} className="text-rose-600"/>
                  </div>
                  <h3 className="text-[19px] font-black text-slate-900 mb-2.5">오프라인 코스</h3>
                  <p className="text-[14.5px] text-slate-500 leading-relaxed mb-5">
                    집합 교육과 출석 관리에 최적화된 플로우입니다.<br/>QR 출석 및 회차 관리를 지원합니다.
                  </p>
                  <div className="flex flex-wrap gap-1.5">
                    <span className="px-2.5 py-1 bg-slate-100 text-slate-600 text-[12px] font-semibold rounded">회차 관리</span>
                    <span className="px-2.5 py-1 bg-slate-100 text-slate-600 text-[12px] font-semibold rounded">QR 출석</span>
                    <span className="px-2.5 py-1 bg-slate-100 text-slate-600 text-[12px] font-semibold rounded">수기 처리</span>
                  </div>
                </button>

                <button
                  onClick={() => goBuilder('blended')}
                  className="group text-left bg-white rounded-2xl p-7 border border-slate-200 hover:border-violet-300 hover:shadow-lg transition-all relative overflow-hidden"
                >
                  <div className="w-14 h-14 rounded-xl bg-violet-50 flex items-center justify-center mb-5">
                    <Layers size={26} className="text-violet-600"/>
                  </div>
                  <h3 className="text-[19px] font-black text-slate-900 mb-2.5">블렌디드 코스</h3>
                  <p className="text-[14.5px] text-slate-500 leading-relaxed mb-5">
                    온라인 학습과 집합 교육을 한 과정에 결합합니다.<br/>VOD·문서와 오프라인 출석을 함께 운영하세요.
                  </p>
                  <div className="flex flex-wrap gap-1.5">
                    <span className="px-2.5 py-1 bg-slate-100 text-slate-600 text-[12px] font-semibold rounded">VOD</span>
                    <span className="px-2.5 py-1 bg-slate-100 text-slate-600 text-[12px] font-semibold rounded">오프라인 출석</span>
                    <span className="px-2.5 py-1 bg-slate-100 text-slate-600 text-[12px] font-semibold rounded">혼합 편성</span>
                  </div>
                </button>
              </div>

              <p className="text-center text-[12.5px] text-slate-400 mt-12">등록 후에도 코스 유형 일부 설정은 변경 가능합니다</p>
            </div>
          </div>
        )}
      </div>
    );
  };

  createRoot(document.getElementById('root')).render(<App/>);
</script>
<script src="feature-highlight.js"></script>
</body>
</html>
