    // 한 줄 유지 — 폭을 넘으면 잘라낸다. 측정은 캔버스로 하고 SVG도 그 결과를 쓴다.
    const mctx = _measureCanvas.getContext('2d');
    const fit = (text, size, weight) => {
      mctx.font = `${weight} ${size}px ${QR_FAM}`;
      const full = String(text || '');
      let t = full;
      while (t && mctx.measureText(t).width > W - pad * 2) t = t.slice(0, -1);
      return t === full ? t : t.slice(0, -1) + '…';
    };
    // 장소는 회차 → 차수 상속(2단). 회차마다 장소가 다른 코스에서 부착 대조의 기준이 된다
    const sub = placeLabel ? `학습시간 ${studyLabel} · ${placeLabel}` : `학습시간 ${studyLabel}`;
    return { q, n, px, qrSize, pad, fTitle, fMain, fSub, fFoot, gap, headH, footH, W, H,
      title: fit(COURSE.title, fTitle, 500),
      main:  fit(`${sessName} · ${kind}`, fMain, 800),
      sub:   fit(sub, fSub, 500),
      foot:  issuedAt ? `발급 ${issuedAt}` : '' };
  };
  const drawQrSheet = (canvas, sheet) => {
    const L = qrSheetLayout(sheet);
    canvas.width = L.W; canvas.height = L.H;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, L.W, L.H);

    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    let y = L.pad;
    ctx.fillStyle = '#64748b'; ctx.font = `500 ${L.fTitle}px ${QR_FAM}`;
    ctx.fillText(L.title, L.W / 2, y); y += L.fTitle + L.gap;
    // 회차명 + 입장/퇴장 — 가장 크게
    ctx.fillStyle = '#0f172a'; ctx.font = `800 ${L.fMain}px ${QR_FAM}`;
    ctx.fillText(L.main, L.W / 2, y); y += L.fMain + L.gap;
    // 학습시간
    ctx.fillStyle = '#64748b'; ctx.font = `500 ${L.fSub}px ${QR_FAM}`;
    ctx.fillText(L.sub, L.W / 2, y);

    // QR — 헤더 아래
    ctx.fillStyle = '#0f172a';
    const g = qrCells(sheet.token, L.n);
    for (let gy = 0; gy < L.n; gy++) for (let gx = 0; gx < L.n; gx++)
      if (g[gy][gx]) ctx.fillRect((gx + L.q) * L.px, L.headH + (gy + L.q) * L.px, L.px, L.px);

    // 발급일 — QR 아래
    if (L.foot) {
      ctx.fillStyle = '#94a3b8'; ctx.font = `500 ${L.fFoot}px ${QR_FAM}`;
      ctx.fillText(L.foot, L.W / 2, L.headH + L.qrSize + Math.round(L.px * 0.5));
    }
  };
  /* ── SVG 시트 (2026-08-11) ──
     현장에서 A4·라벨지 크기가 제각각이라 확대해도 안 뭉개지는 벡터가 필요하다. 구성은 PNG와 같다.
     모듈은 가로 연속분을 한 <rect>로 합친다 — 625칸을 낱개로 뱉으면 파일만 커진다. */
  const svgEsc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const qrSheetSvg = (sheet) => {
    const L = qrSheetLayout(sheet);
    const g = qrCells(sheet.token, L.n);
    let rects = '';
    for (let gy = 0; gy < L.n; gy++) {
      let run = 0;
      for (let gx = 0; gx <= L.n; gx++) {
        const on = gx < L.n && g[gy][gx];
        if (on) { run++; continue; }
        if (run) {
          rects += `<rect x="${(gx - run + L.q) * L.px}" y="${L.headH + (gy + L.q) * L.px}" width="${run * L.px}" height="${L.px}"/>`;
          run = 0;
        }
      }
    }
    // 캔버스는 textBaseline='top' — SVG는 기준선이 달라 폰트 크기의 약 0.82를 내려 맞춘다
    const tx = L.W / 2;
    const yTitle = L.pad + Math.round(L.fTitle * 0.82);
    const yMain  = L.pad + L.fTitle + L.gap + Math.round(L.fMain * 0.82);
    const ySub   = L.pad + L.fTitle + L.gap + L.fMain + L.gap + Math.round(L.fSub * 0.82);
    const yFoot  = L.headH + L.qrSize + Math.round(L.px * 0.5) + Math.round(L.fFoot * 0.82);
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${L.W}" height="${L.H}" viewBox="0 0 ${L.W} ${L.H}">`
      + `<rect width="${L.W}" height="${L.H}" fill="#ffffff"/>`
      + `<g font-family='${QR_FAM}' text-anchor="middle">`
      + `<text x="${tx}" y="${yTitle}" font-size="${L.fTitle}" font-weight="500" fill="#64748b">${svgEsc(L.title)}</text>`
      + `<text x="${tx}" y="${yMain}" font-size="${L.fMain}" font-weight="800" fill="#0f172a">${svgEsc(L.main)}</text>`
      + `<text x="${tx}" y="${ySub}" font-size="${L.fSub}" font-weight="500" fill="#64748b">${svgEsc(L.sub)}</text>`
      + (L.foot ? `<text x="${tx}" y="${yFoot}" font-size="${L.fFoot}" font-weight="500" fill="#94a3b8">${svgEsc(L.foot)}</text>` : '')
      + `</g><g fill="#0f172a" shape-rendering="crispEdges">${rects}</g></svg>`;
  };
  // 파일명도 식별자로 유지 (F10 → I5) — 이제 이미지 자체에도 정보가 있다
  const qrFileBase = (pkgName, sessName, kind, issuedAt) =>
    [COURSE.title, pkgName, sessName, kind, issuedAt.replace(/-/g, '')]
      .map(s => String(s).trim().replace(/\s+/g, '').replace(/[\\/:*?"<>|]/g, ''))
      .join('_');
  const qrFileName = (pkgName, sessName, kind, issuedAt, ext = 'png') =>
    `${qrFileBase(pkgName, sessName, kind, issuedAt)}.${ext}`;
  const saveAs = (href, fileName, revoke) => {
    const a = document.createElement('a');
    a.href = href; a.download = fileName; a.click();
    if (revoke) setTimeout(() => URL.revokeObjectURL(href), 1000);
  };
  const downloadQr = (sheet, fileName) => {
    const c = document.createElement('canvas');

  };
  const downloadQrSvg = (sheet, fileName) => {
    const blob = new Blob([qrSheetSvg({ ...sheet, px: 16 })], { type: 'image/svg+xml;charset=utf-8' });
    saveAs(URL.createObjectURL(blob), fileName, true);
  };

    const c = document.createElement('canvas');

    c.toBlob(b => b.arrayBuffer().then(ab => resolve(new Uint8Array(ab))), 'image/png');

  /* ── ZIP 묶기 (2026-08-11) ──
     수십 장을 한 장씩 저장하게 두면 브라우저 다중 다운로드 경고에 걸리고 폴더가 뒤섞인다.
     압축은 store(무압축) — PNG는 이미 압축본이라 deflate 이득이 거의 없고, 그 대가로 외부 라이브러리를 안 쓴다. */
  const _crcTable = (() => {
    const t = new Uint32Array(256);
    for (let i = 0; i < 256; i++) { let c = i; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[i] = c >>> 0; }
    return t;
  })();
  const crc32 = (buf) => {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < buf.length; i++) c = _crcTable[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  };
  const zipBlob = (files) => {                    // files: [{name, data:Uint8Array}]
    const enc = new TextEncoder();
    const d = new Date();
    const dosTime = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
    const dosDate = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
    const local = [], central = [];
    let offset = 0;
    files.forEach(f => {
      const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true);
      lh.setUint16(6, 0x0800, true);                 // UTF-8 파일명 (한글 차수·회차명)
      lh.setUint16(8, 0, true);                      // 0 = store
      lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
      lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
      local.push(new Uint8Array(lh.buffer), name, f.data);

      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
      ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true);
      ch.setUint32(16, crc, true); ch.setUint32(20, size, true); ch.setUint32(24, size, true);
      ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
      central.push(new Uint8Array(ch.buffer), name);
      offset += 30 + name.length + size;
    });
    const cdSize = central.reduce((n, b) => n + b.length, 0);
    const eocd = new DataView(new ArrayBuffer(22));
    eocd.setUint32(0, 0x06054b50, true);
    eocd.setUint16(8, files.length, true); eocd.setUint16(10, files.length, true);
    eocd.setUint32(12, cdSize, true); eocd.setUint32(16, offset, true);
    return new Blob([...local, ...central, new Uint8Array(eocd.buffer)], { type: 'application/zip' });
  };
  const zipSafe = (s) => String(s).trim().replace(/\s+/g, '').replace(/[\\/:*?"<>|]/g, '');
  /* 화면 미리보기 = 인쇄물과 같은 구성. 다르면 미리보기가 아니다. */
  const QrBox = ({ sheet, px = 5, width = 148 }) => {

      [sheet.token, sheet.sessName, sheet.studyLabel, sheet.placeLabel, sheet.issuedAt, sheet.kind, px]);
    return <canvas ref={ref} className="rounded-lg border border-slate-200 bg-white" style={{ width }}/>;

  function calDays(y, m) {
    const first = new Date(y, m-1, 1).getDay();
    const offset = first === 0 ? 6 : first - 1;
    const last = new Date(y, m, 0).getDate();
    const days = [...Array(offset).fill(null), ...Array.from({length:last},(_,i)=>i+1)];
    while (days.length % 7) days.push(null);

  const TODAY = '2026-04-28';
  const fmtDate = d => d ? d.replace(/-/g,'.').slice(2) : '-';

  const fmtRange = (s,e) => e&&e!==s ? `${fmtDate(s)} ~ ${fmtDate(e)}` : fmtDate(s);
  /* 조퇴(early_leave) — 공용 기본정책 (2026-05-27, attendance-rate-policy)
     조퇴도 출석으로 인정(분자 포함) + 사유 기록. 모든 오프라인 코스 동일.

     집계 데이터에 early 버킷 없으면 0으로 안전 처리. */
  const presentOf = s => s.att + s.late + (s.early || 0);          // 분자: 출석+지각+조퇴

  /* 학습 시간 — 회차 수업시간(end-start) 합산. (국비교육 시수 strict 기준은 Phase 3) */
  const durationMin = (start, end) => {
    if (!start || !end) return 0;
    const [sh, sm] = start.split(':').map(Number);
    const [eh, em] = end.split(':').map(Number);
    return Math.max(0, (eh*60+em) - (sh*60+sm));
  };
  const fmtDuration = (m) => {

    if (h && mm) return `${h}시간 ${mm}분`;
    if (h) return `${h}시간`;
    return `${mm}분`;
  };
  const sessionStudyMin = s => (s.studyMinOverride != null ? s.studyMinOverride : durationMin(s.start, s.end));  // 관리자 직접 입력(override) 우선, 없으면 자동

  /* ── 일정 겹침 판정 (2026-08-11 I14) ──
     빌더 `_sessConflict`와 **같은 규칙**이다 — 백엔드가 두 진입점에서 같은 판정을 요구했다.
     기준은 사람 하나: **같은 사람이 같은 시간에 두 곳에 있을 수 없다.**
     그래서 코스·차수·장소를 보지 않고 **시간만** 본다. 규칙이 하나로 줄어든다.
     경계는 열림 — `12:00 종료 → 12:00 시작`은 겹침이 아니다(연속 수업). 이동시간 버퍼는 두지 않는다:
     몇 분을 둘지는 물리 법칙이 아니라 운영 판단이라 스펙에 넣으면 끝없이 흔들린다. */
  const _toMin = t => { const [h, m] = String(t || '').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
  const slotConflict = (a, b) => a.date && b.date && a.date === b.date
    && _toMin(a.start) < _toMin(b.end) && _toMin(b.start) < _toMin(a.end);
  const pkgStudyMin = pkg => pkg.sessions.reduce((b,s)=>b + sessionStudyMin(s), 0);  // 차수당 학습시간(회차 합)
  /* 강사 = 회차 → 차수(pkg.instructor) → 대표(COURSE.instructor) 3단 상속. 읽기 전용 표시 */
  const effInstructor = (pkg, s) => (s.instructor && s.instructor.trim()) || (pkg && pkg.instructor && pkg.instructor.trim()) || COURSE.instructor || '';
  const isMixedInstructor = pkg => new Set((pkg.sessions||[]).map(s => effInstructor(pkg, s)).filter(Boolean)).size > 1;
  // 이 코스가 차수/회차 강사를 쓰는가(차수 또는 회차에 강사 지정) → 쓰면 모든 차수의 회차 테이블에 '강사' 열을 일관 노출
  const courseHasSessInstr = COURSE.packages.some(p => (p.instructor && p.instructor.trim()) || (p.sessions||[]).some(s => s.instructor && s.instructor.trim()));
  /* 장소 = 회차(s.place) → 차수(pkg.place) 2단 상속. 읽기 전용 표시 (sessionPlaceMode로 회차별 장소 다를 수 있음) */
  const effPlace = (pkg, s) => (s.place && s.place.trim()) || (pkg && pkg.place) || '';
  // 이 코스가 회차별 장소를 쓰는가(회차에 장소 지정) → 쓰면 모든 차수의 회차 테이블에 '장소' 열을 일관 노출
  const courseHasSessPlace = COURSE.packages.some(p => (p.sessions||[]).some(s => s.place && s.place.trim()));
  // 코스 전체 강사 요약 = 대표 + (대표 외 distinct 강사 수). 목록 카드의 "외 N명"과 동일하게 맞춤.
  const otherInstrList = [...new Set(COURSE.packages.flatMap(p => [p.instructor, ...(p.sessions||[]).map(s => s.instructor)]).map(x => (x||'').trim()).filter(Boolean))].filter(n => n !== (COURSE.instructor||'').trim());
  const instrSummary = (COURSE.instructor || '') + (otherInstrList.length ? ` 외 ${otherInstrList.length}명` : '');
  const attRate = s => denomOf(s) > 0 ? Math.round(presentOf(s) / denomOf(s) * 100) : null;
  const pkgAttRate = pkg => {
    const done = pkg.sessions.filter(s => denomOf(s) > 0);
    if(!done.length) return null;
    const total   = done.reduce((a,s)=>a + denomOf(s), 0);
    const present = done.reduce((a,s)=>a + presentOf(s), 0);
    return Math.round(present/total*100);
  };

  const App = () => {

    /* ── 출석 QR 모달 (고정 모드 전용, A3-34·A3-35·A3-47) ──
       08-07 I1: 발급 단위가 차수 → 회차로 바뀌었다. 모달은 차수를 열되 내용은 회차 목록이다.
       토큰은 발급 후 동결(D3). 재발급만 새 토큰을 만들고, 입장·퇴장을 쌍으로 교체한다(F11) — 단위는 회차.

       I7 개정(2026-08-07): 수동 `발급` 단계를 없앴다. 토큰 생성은 비용도 부작용도 없고
       인쇄·부착 전까지 QR은 아무 의미가 없다 — 관리자가 잊을 수 있는 단계만 하나 늘 뿐이었다.
       회차가 생기면 자동 발급되므로 `미발급` 상태는 존재하지 않는다. 남는 조작은 재발급뿐.

       I8 개정(2026-08-11): 모달의 단위는 코스다. 인쇄는 차수 하나가 아니라 코스 전체를 한 번에 뽑는 일이라
       모달은 전체 차수의 회차를 차수별로 묶어 보여주고, 특정 차수에서 들어왔을 때만 그 차수로 필터를 건다.
       필터는 모달 안에서 언제든 [전체]로 풀 수 있다. */
    const [qrModal, setQrModal] = useState(null);        // {pkgId:'all'|차수 id} 또는 null
    const qrKey = (pkgId, sessId) => `${pkgId}:${sessId}`;
    // {`pkgId:sessId`: {rev, issuedAt}} — 키가 없으면 최초 발급본으로 간주(자동 발급)
    const [qrIssues, setQrIssues] = useState({});
    const [qrConfirmReissue, setQrConfirmReissue] = useState(null);  // 2단 확인 대상 `pkgId:sessId` (모달 내 인라인)
    const qrInfoOf = (pkg, sess) => {
      const { rev = 1, issuedAt = '2026-04-06' } = qrIssues[qrKey(pkg.id, sess.id)] || {};
      return { rev, issuedAt,
        tokenIn:  `${COURSE.id}:${pkg.id}:${sess.id}:in:v${rev}`,
        tokenOut: `${COURSE.id}:${pkg.id}:${sess.id}:out:v${rev}` };
    };
    const reissueQr = (pkg, sess) => {
      setQrIssues(prev => ({ ...prev,
        [qrKey(pkg.id, sess.id)]: { rev: (prev[qrKey(pkg.id, sess.id)]?.rev || 1) + 1, issuedAt: TODAY } }));
      setQrConfirmReissue(null);
    };

    /* ── 전체 다운로드 (2026-08-11) ──
       회차별 발급(I1) 이후 한 코스에서 뽑을 장수가 수십 장이 됐다. 한 장씩 누르게 두면 빠뜨린다.
       파일은 개별 다운로드와 **완전히 같은 것**을 차수 폴더로 묶어 ZIP 하나로 준다 —
       합본 이미지를 만들면 라벨로 못 쓰고, 낱개 저장은 다중 다운로드 경고에 걸린다.
       PNG·SVG를 함께 담아 버튼을 하나로 유지한다(형식 선택은 개별 카드에서). */
    const [qrBulk, setQrBulk] = useState(null);   // {done, total} 또는 null
    const qrSheetsOf = (pkgs) => {
      const out = [];
      pkgs.forEach(pkg => pkg.sessions.forEach(s => {
        const q = qrInfoOf(pkg, s);
        const studyLabel = fmtDuration(sessionStudyMin(s));
        const kinds = CHECKOUT_ON
          ? [{ kind:'입장', token:q.tokenIn }, { kind:'퇴장', token:q.tokenOut }]
          : [{ kind:'입장', token:q.tokenIn }];
        kinds.forEach(k => out.push({
          sheet: { token:k.token, sessName:s.name, studyLabel,
                   placeLabel: effPlace(pkg, s), issuedAt: q.issuedAt, kind:k.kind },
          dir: zipSafe(pkg.name),
          /* 파일명에 발급일을 남긴다 (I5) — 재발급 후 다시 받은 ZIP이 구버전과 같은 이름이면
             폴더에서 섞이고 덮어쓴다. 코스·차수는 루트 폴더와 상위 폴더가 이미 지고 있다. */
          base: `${zipSafe(s.name)}_${k.kind}_${q.issuedAt.replace(/-/g,'')}`,
        }));
      }));
      return out;
    };
    const downloadQrZip = async (pkgs, scopeLabel) => {
      if (qrBulk) return;                          // 진행 중 재진입 방지
      const jobs = qrSheetsOf(pkgs);
      if (!jobs.length) return;
      setQrBulk({ done: 0, total: jobs.length });
      const enc = new TextEncoder();
      const root = zipSafe(`${COURSE.title}_출석QR_${scopeLabel}_${TODAY.replace(/-/g,'')}`);
      const files = [];
      for (let i = 0; i < jobs.length; i++) {
        const j = jobs[i];
        files.push({ name: `${root}/${j.dir}/${j.base}.png`, data: await qrPngBytes(j.sheet) });
        files.push({ name: `${root}/${j.dir}/${j.base}.svg`, data: enc.encode(qrSheetSvg({ ...j.sheet, px: 16 })) });
        setQrBulk({ done: i + 1, total: jobs.length });
      }
      saveAs(URL.createObjectURL(zipBlob(files)), `${root}.zip`, true);
      setTimeout(() => setQrBulk(null), 1200);
    };
    const closeQrModal = () => { setQrModal(null); setQrConfirmReissue(null); };
    const setQrScope = (pkgId) => { setQrModal({ pkgId }); setQrConfirmReissue(null); };
    /* 모드가 진입 동작을 정한다 (E9). 고정 모드에서는 라이브 전체화면으로 가지 않는다.
       pkg 없이 부르면(코스 단위 진입) 전체 차수로 연다. */
    const openAttendanceQr = (pkg) => ATT_MODE === 'fixed'

    /* ── 수강생 삭제 (A3-38·A3-39) ──
       삭제 대상은 "이 차수의 수강 등록"이다. 등록이 차수 단위이므로 삭제도 차수 단위여야 한다.
       등록이 사라지면 그 등록에 매달린 출결·인정시각·사유·학습시간·수료 판정도 함께 사라진다 —
       등록 없는 출결은 주인이 없어 집계에도, 감사에도 쓸 수 없다. 복구는 없다(코스 삭제와 동일 스탠스).
       회원 계정과 다른 코스·차수 수강 이력은 건드리지 않는다.
       수료 확정자는 삭제하지 않는다 — 수료는 출석률로 자동 확정된 이수 사실이고, 수료증·법정교육 감사의 근거다. */
    const [removedIds, setRemovedIds] = useState(() => new Set());
    const [delSel, setDelSel] = useState(() => new Set());   // 일괄 삭제 선택 (학습자 id)

    const LEARNERS = useMemo(() => LEARNERS_RAW.filter(l => !removedIds.has(l.id)), [removedIds]);

    /* ── 회차선택형(sessionSelect) — 등록 단위가 차수가 아니라 회차다 (08-06 H4·H5) ──
       학습자가 차수 안에서 회차 1개만 고르므로 `learner.pickSessId`가 그 값이다
       (설계 모델의 `sessionPick[pkgId][userId]`를 프로토타입에선 학습자 레코드에 눕혀 둔다).
       sessionSelect가 아닌 차수는 이 값이 없고, 차수 등록 = 전 회차 수강이라 아무것도 좁히지 않는다.

       이걸 안 좁히면 회차 5개짜리 차수에서 1회차만 신청한 학습자가
       나머지 4회차에 결석으로 잡혀 `1/5 = 20%`가 된다 — 법정의무교육의 100%가 구조적으로 불가능해진다. */
    const pkgById = id => COURSE.packages.find(p => p.id === id);
    // 그 회차의 명부 — 회차선택형이면 그 회차를 신청한 사람만
    const rosterOf = (pkg, sess) => {
      const base = LEARNERS.filter(l => l.pkgId === pkg.id);
      return (pkg.sessionSelect && sess) ? base.filter(l => l.pickSessId === sess.id) : base;
    };
    // 그 학습자가 이 차수에서 출석률 분모로 삼을 회차들
    const ratedSessions = (learnerId, pkg) => {
      if (!pkg.sessionSelect) return pkg.sessions;
      const l = LEARNERS_RAW.find(x => x.id === learnerId);
      return pkg.sessions.filter(s => s.id === l?.pickSessId);
    };

    // C-3/C-4: per-learner attendance map — key: `${learnerId}_${sessionId}`
    const [attendanceMap, setAttendanceMap] = useState(() => {
      const map = {};
      COURSE.packages.forEach(pkg => {
        const all = LEARNERS_RAW.filter(l => l.pkgId === pkg.id);
        pkg.sessions.forEach(s => {
          // 회차선택형은 그 회차 신청자에게만 출결을 깐다. 나머지는 키 자체를 만들지 않는다 —
          // 'pending'으로라도 깔아두면 "신청 안 함"과 "신청했는데 미확인"이 구분되지 않는다
          const pkgL = pkg.sessionSelect ? all.filter(l => l.pickSessId === s.id) : all;
          const sts = [
            ...Array(s.att).fill('attended'),
            ...Array(s.late).fill('late'),
            ...Array(s.abs).fill('absent'),
            ...Array(s.pending).fill('pending'),
          ];
          pkgL.forEach((l, i) => { map[`${l.id}_${s.id}`] = i < sts.length ? sts[i] : 'pending'; });
        });
      });
      return map;
    });
    // C-2: mutable completion map
    const [completionMap, setCompletionMap] = useState(() => ({...COMPLETION}));
    const [deptModalOpen, setDeptModalOpen] = useState(false);
    const [deptPage, setDeptPage] = useState(1);
    const [attnHover, setAttnHover] = useState(null);  // 회차별 출석률 추이 라인 hover 인덱스
    // C-1: set of explicitly closed session IDs
    const [closedSessions, setClosedSessions] = useState(() => {
      const cs = new Set();
      COURSE.packages.forEach(pkg => pkg.sessions.forEach(s => {
        if ((s.att + s.late + s.abs > 0) && s.pending === 0) cs.add(s.id);
      }));
      return cs;
    });
    // C-3: currently expanded session key (`${pkgId}_${sessId}`)
    const [expandedSession, setExpandedSession] = useState(null);
    // 관리자 수동 인정 시간 맵 — key: `${learnerId}_${sessId}`
    const [tsMap, setTsMap] = useState({});
    const [reasonMap, setReasonMap] = useState({});   // 조퇴·결석 사유 {learnerId_sessId: reason}
    // QR 스캔 시간 맵 — 학습자가 실제 QR 찍은 시간 (모의 데이터: 기존 att/late 학습자에 시뮬 시간 부여)
    const [scanTimeMap, setScanTimeMap] = useState(() => {
      const map = {};
      COURSE.packages.forEach(pkg => {
        const all = LEARNERS_RAW.filter(l => l.pkgId === pkg.id);
        pkg.sessions.forEach(s => {
          const pkgL = pkg.sessionSelect ? all.filter(l => l.pickSessId === s.id) : all;
          const sts = [
            ...Array(s.att).fill('attended'),
            ...Array(s.late).fill('late'),
            ...Array(s.abs).fill('absent'),
            ...Array(s.pending).fill('pending'),
          ];
          const [sh, sm] = s.start.split(':').map(Number);
          pkgL.forEach((l, i) => {
            const st = i < sts.length ? sts[i] : 'pending';
            if (st === 'attended' || st === 'late') {
              const offset = st === 'late' ? 12 + (i % 8) * 2 : (i % 5);
              const totalMin = sm + offset;
              const h = sh + Math.floor(totalMin / 60);
              const m = totalMin % 60;
              const sec = (i * 17) % 60;
              const d = s.date.replace(/-/g, '/');
              map[`${l.id}_${s.id}`] = `${d} ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
            }
          });
        });
      });
      return map;
    });
    // 현재 열린 상태 드롭다운 키 + fixed 포지션
    const [openDropdown, setOpenDropdown] = useState(null);
    const [dropdownPos, setDropdownPos] = useState({x:0,y:0});
    // 출석 명단 모달 — { pkg, session, pkgL }
    const [attModal, setAttModal] = useState(null);
    const [modalFilter, setModalFilter] = useState('all');
    const [modalSearch, setModalSearch] = useState('');
    const toggleDD = (key, e) => {
      e.stopPropagation();
      if (openDropdown === key) { setOpenDropdown(null); return; }
      const rect = e.currentTarget.getBoundingClientRect();
      const ddW = 130;
      const x = Math.max(0, Math.min(rect.right - ddW, window.innerWidth - ddW - 8));
      setDropdownPos({ x, y: rect.bottom + 4 });
      setOpenDropdown(key);
    };

    const [sideExpanded, setSideExpanded] = useState(new Set(['course', 'course-v2']));
    const toggleSideMenu = id => setSideExpanded(prev => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });

    const [showCreateModal, setShowCreateModal] = useState(false);
    useEffect(() => {
      if (!showCreateModal) return;
      const onKey = (e) => { if (e.key === 'Escape') setShowCreateModal(false); };
      window.addEventListener('keydown', onKey);
      return () => window.removeEventListener('keydown', onKey);
    }, [showCreateModal]);
    const goBuilder = (type) => {
      const map = { online: 'online-builder.html', offline: 'offline-builder.html', blended: 'blended-builder.html' };
      window.location.href = map[type] || 'online-builder.html';
    };

    // C-5: BroadcastChannel setup
    useEffect(() => {
      bcRef.current = new BroadcastChannel('offline_attendance');
      return () => bcRef.current?.close();
    }, []);

    useEffect(() => {
      if (!delModal) return;
      const onKey = (e) => { if (e.key === 'Escape') closeDelModal(); };
      window.addEventListener('keydown', onKey);
      return () => window.removeEventListener('keydown', onKey);
    }, [delModal]);

    useEffect(() => {
      if (!openDropdown) return;
      const close = () => setOpenDropdown(null);
      document.addEventListener('click', close);
      return () => document.removeEventListener('click', close);
    }, [openDropdown]);

    useEffect(() => {
      if (liveMode) {
        setQrCountdown(30);
        bcRef.current?.postMessage({type:'LIVE_MODE_START',courseId:COURSE.id,ts:Date.now()});
        qrTimerRef.current = setInterval(() => setQrCountdown(p => {
          if (p <= 1) {
            bcRef.current?.postMessage({type:'QR_REFRESH',courseId:COURSE.id,ts:Date.now()});
            return 30;
          }
          return p - 1;
        }), 1000);
      }
      return () => clearInterval(qrTimerRef.current);
    }, [liveMode]);

    /* 계산값 */
    const learners = useMemo(() => LEARNERS.map(l => ({
      ...l, completion: completionMap[l.id] || 'not_started',
      pkg: COURSE.packages.find(p => p.id === l.pkgId),
    })), [completionMap, LEARNERS]);

    const filtered = useMemo(() => {
      let list = learners;
      if(pkgFilter !== 'all') list = list.filter(l => l.pkgId === pkgFilter);
      if(search.trim()) { const q=search.toLowerCase(); list=list.filter(l=>l.name.includes(q)||l.dept.includes(q)||(l.loginId||'').toLowerCase().includes(q)); }
      return list;
    }, [learners, pkgFilter, search]);

    const totalEnrolled = COURSE.packages.reduce((s,p)=>s+p.enrolled,0);
    const totalCapacity = COURSE.packages.reduce((s,p)=>s+p.capacity,0);
    const completedCount = learners.filter(l=>l.completion==='completed').length;
    // 그룹별 수료 집계 — 학습자 dept(그룹명) 기준, 수강 인원 desc. 100+ 그룹은 페이지네이션 모달로.
    const deptStats = useMemo(() => {
      const m = {};
      learners.forEach(l => { const d = l.dept || '미지정'; if(!m[d]) m[d] = {dept:d, count:0, completed:0}; m[d].count++; if(l.completion==='completed') m[d].completed++; });
      return Object.values(m).sort((a,b)=> b.count - a.count);
    }, [learners]);
    const totalSessions = COURSE.packages.reduce((s,p)=>s+p.sessions.length,0);

    const todayPkg = COURSE.packages.find(p => p.startDate <= TODAY && p.endDate >= TODAY);
    const todaySess = todayPkg?.sessions.find(s => s.date === TODAY);

    const overallRate = useMemo(() => {
      let present=0, total=0;
      COURSE.packages.forEach(p=>p.sessions.forEach(s=>{if(denomOf(s)>0){present+=presentOf(s);total+=denomOf(s);}}));
      return total>0?Math.round(present/total*100):0;
    },[]);

    // 평균 학습시간 (수강생 1인 평균 — 출석/지각/조퇴 회차 시간 합)
    const avgStudyMin = useMemo(() => {
      if (!LEARNERS.length) return 0;
      const sum = LEARNERS.reduce((acc,l)=>{
        const pkg = COURSE.packages.find(p=>p.id===l.pkgId);
        if (!pkg) return acc;
        return acc + ratedSessions(l.id, pkg).reduce((a,s)=>{
          const st = attendanceMap[`${l.id}_${s.id}`]||'pending';
          return a + ((st==='attended'||st==='late'||st==='early_leave')?sessionStudyMin(s):0);
        },0);
      },0);
      return Math.round(sum / LEARNERS.length);
    },[attendanceMap, LEARNERS]);

    const downloadStudentExcel = () => {
      const bom = '﻿';
      const headers = ['아이디', '이름', '그룹', '차수', '수료상태', '출석횟수'];
      const rows = learners.map(l => {
        const pkg = COURSE.packages.find(p => p.id === l.pkgId);
        const doneSess = pkg?.sessions.filter(s=>s.att+s.late+s.abs>0).length || 0;
        return [l.loginId||'', l.name, l.dept, pkg?.name||'', COMPL_CFG[l.completion]?.label||'', doneSess];
      });
      const csv = [headers, ...rows].map(r=>r.join(',')).join('\n');
      const blob = new Blob([bom+csv], {type:'text/csv;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `${COURSE.title}_수강생목록.csv`; a.click();
      URL.revokeObjectURL(url);
    };

    const downloadSampleExcel = () => {
      const bom = '﻿';
      const headers = ['아이디(이메일)', '이름', '그룹'];
      const rows = [
        ['hong@company.com','홍길동','개발팀'],
        ['kim@company.com','김철수','마케팅팀'],
        ['lee@company.com','이영희','영업팀'],
      ];
      const csv = [headers, ...rows].map(r=>r.join(',')).join('\n');
      const blob = new Blob([bom+csv], {type:'text/csv;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = '수강생_대량등록_양식.csv'; a.click();
      URL.revokeObjectURL(url);
    };

    // C-3/C-4: compute live session counts from attendanceMap
    const getSessionCounts = (sessId, pkgId) => {
      // 회차선택형은 그 회차를 신청한 사람만 센다 — 차수 명부를 그대로 쓰면
      // 신청도 안 한 사람이 매 회차 `미확인`으로 잡혀 회차 통계가 부풀려진다
      const _pkg = pkgById(pkgId);
      const pkgL = (_pkg?.sessionSelect)
        ? LEARNERS.filter(l => l.pkgId === pkgId && l.pickSessId === sessId)
        : LEARNERS.filter(l => l.pkgId === pkgId);
      let att = 0, late = 0, el = 0, abs = 0, pending = 0;
      pkgL.forEach(l => {
        switch (attendanceMap[`${l.id}_${sessId}`] || 'pending') {
          case 'attended':    att++;     break;
          case 'late':        late++;    break;
          case 'early_leave': el++;      break;
          case 'absent':      abs++;     break;
          default:            pending++; break;
        }
      });
      return { att, late, el, abs, pending };
    };

    // C-1: close session — convert pending → absent
    const closeSession = (sessId, pkgId) => {
      // 회차선택형은 그 회차 신청자만 결석으로 넘긴다 —
      // 차수 명부를 그대로 돌리면 신청도 안 한 사람이 결석 처리된다
      const _pkg = pkgById(pkgId);
      const pkgL = LEARNERS.filter(l => l.pkgId === pkgId
        && (!_pkg?.sessionSelect || l.pickSessId === sessId));
      setAttendanceMap(prev => {
        const next = {...prev};
        pkgL.forEach(l => {
          const k = `${l.id}_${sessId}`;
          if (!next[k] || next[k] === 'pending') next[k] = 'absent';
        });
        return next;
      });
      setClosedSessions(prev => new Set([...prev, sessId]));
    };

    // C-3: change individual learner attendance status
    const changeAttendance = (learnerId, sessId, status) => {
      setAttendanceMap(prev => ({...prev, [`${learnerId}_${sessId}`]: status}));
    };

    // 조퇴·결석 사유 기록 (정당 사유 예외 — 관리자 임의 아님, audit 근거)
    const REASON_PRESETS = ['병가', '경조사', '공무·업무', '기타'];
    const setAttReason = (learnerId, sessId, reason) => {
      const key = `${learnerId}_${sessId}`;
      setReasonMap(prev => { const n = {...prev}; if (reason) n[key] = reason; else delete n[key]; return n; });
    };

    // 타임스탬프 포맷: 2026/04/28 19:50:47
    const fmtTs = () => {
      const d = new Date();
      const pad = n => String(n).padStart(2,'0');
      return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    };

    // 출석인정 + 타임스탬프 기록
    // isQrScan=true → scanTimeMap(학습자 스캔 시간), false → tsMap(관리자 인정 시간)
    const recordAttendance = (learnerId, sessId, status, pkgId, learnerName, isQrScan = false) => {
      changeAttendance(learnerId, sessId, status);
      const key = `${learnerId}_${sessId}`;
      // 사유는 조퇴·결석에서만 의미 — 그 외 상태로 바뀌면 사유 제거
      if (status !== 'early_leave' && status !== 'absent') {
        setReasonMap(prev => { const n = {...prev}; delete n[key]; return n; });
      }
      if (status === 'attended' || status === 'late' || status === 'early_leave') {
        if (isQrScan) {
          setScanTimeMap(prev => ({...prev, [key]: prev[key] || fmtTs()}));
        } else {
          setTsMap(prev => ({...prev, [key]: prev[key] || fmtTs()}));
        }
      } else {
        setTsMap(prev => { const n = {...prev}; delete n[key]; return n; });
        setScanTimeMap(prev => { const n = {...prev}; delete n[key]; return n; });
      }
      bcRef.current?.postMessage({type:'ATTENDANCE_CHANGE',learnerId,name:learnerName,sessionId:sessId,pkgId,status,ts:Date.now()});
    };

    // 학습자별 출석률: (출석+지각+조퇴) / (확정 회차). 조퇴=출석 인정 공용정책. 미확정(pending)은 분모 제외.
    // 분모 범위 = 일반 차수는 차수 전 회차, **회차선택형은 본인 등록 회차만** (08-06 H4).
    const learnerPkgRate = (learnerId, pkg) => {
      let present = 0, denom = 0;
      ratedSessions(learnerId, pkg).forEach(s => {
        const st = attendanceMap[`${learnerId}_${s.id}`] || 'pending';
        if (st === 'pending') return;
        denom++;
        if (st === 'attended' || st === 'late' || st === 'early_leave') present++;
      });
      return denom > 0 ? Math.round(present / denom * 100) : null;
    };
    // 모든 회차 종료된 차수에서 수료 기준(출석률) 미달 인원 수. 미종료/판정불가면 null.
    const pkgBelowCount = pkg => {
      // 회차선택형은 학습자마다 판정 시점이 다르므로 차수 단위 게이트를 걸지 않는다 —
      // 본인 회차가 끝난 사람만 세고, 아직 안 끝난 사람은 집계에서 빠진다
      if (!pkg.sessionSelect) {
        const allClosed = pkg.sessions.length > 0 && pkg.sessions.every(s => closedSessions.has(s.id));
        if (!allClosed) return null;
      }
      return LEARNERS.filter(l => l.pkgId === pkg.id)
        .filter(l => {
          const mine = ratedSessions(l.id, pkg);
          if (!(mine.length > 0 && mine.every(s => closedSessions.has(s.id)))) return false;
          const r = learnerPkgRate(l.id, pkg); return r !== null && r < COMPLETION_MIN_RATE;
        }).length;
    };
    // C-2: 수료 자동 판정 — 출석률 기준. 차수 전 회차 종료 시 충족=수료/미달=미수료 확정, 진행 중=in_progress, 출결 없으면 not_started.
    // 관리자 수동 일괄판정 버튼 제거(2026-06-25) — 출석 변경 시 자동 재계산. 전원 일괄 수료 금지(컴플라이언스)는 미달자 자동 incomplete로 보장.
    useEffect(() => {
      const next = {};
      COURSE.packages.forEach(pkg => {
        LEARNERS.filter(l => l.pkgId === pkg.id).forEach(l => {
          // 판정 범위도 분모와 같다 — 회차선택형은 **본인 등록 회차**가 끝나면 판정한다(H4).
          // 차수 전 회차를 기다리면 5/20 신청자가 6/3까지 `진행 중`으로 묶인다
          const mine = ratedSessions(l.id, pkg);
          const allClosed = mine.length > 0 && mine.every(s => closedSessions.has(s.id));
          const r = learnerPkgRate(l.id, pkg);
          next[l.id] = r === null ? 'not_started' : (!allClosed ? 'in_progress' : (r >= COMPLETION_MIN_RATE ? 'completed' : 'incomplete'));
        });
      });
      setCompletionMap(next);
    }, [attendanceMap, closedSessions, LEARNERS]);

    /* ── 수강생 삭제 — 사라지는 양을 먼저 세어 보여주고, 그 크기만큼 확인 단계를 올린다 ── */
    // 출결 기록 건수 = 미확인이 아닌 회차 수. 0이면 "지울 이력이 없는 등록"이라 확인 1단계로 충분하다.
    const attnRecordCount = (learnerId, pkg) => pkg
      ? ratedSessions(learnerId, pkg).filter(s => (attendanceMap[`${learnerId}_${s.id}`] || 'pending') !== 'pending').length : 0;
    // 누적 학습시간(분) — 출석·지각·조퇴 회차 합. 삭제 시 평균 학습시간 KPI에서 빠진다.
    const studyMinOf = (learnerId, pkg) => pkg
      ? ratedSessions(learnerId, pkg).reduce((a,s)=>{
          const st = attendanceMap[`${learnerId}_${s.id}`] || 'pending';
          return a + ((st==='attended'||st==='late'||st==='early_leave') ? sessionStudyMin(s) : 0);
        },0) : 0;
    /* 삭제 대상에 상태 제한을 두지 않는다 — 회차·차수가 종료됐든 수료가 확정됐든 지울 수 있다.
       운영자가 최종 판단자이고, 시스템이 대신 거부하면 잘못 등록된 기록을 영구히 안고 가게 된다.
       대신 수료 확정자가 섞이면 무엇이 사라지는지(수료 기록·수료증 근거) 모달에서 분명히 경고한다. */
    const isCompleted = id => (completionMap[id] || 'not_started') === 'completed';
    const delTargets = ids => ids.map(id => {
      const l = LEARNERS.find(x => x.id === id); if (!l) return null;
      const pkg = COURSE.packages.find(p => p.id === l.pkgId);
      return { ...l, pkg, attn: attnRecordCount(id, pkg), study: studyMinOf(id, pkg), done: isCompleted(id) };
    }).filter(Boolean);
    const openDelModal = ids => { setDelConfirmText(''); setDelModal({ ids }); };
    const closeDelModal = () => { setDelModal(null); setDelConfirmText(''); };
    const toggleDelSel = id => setDelSel(prev => { const n=new Set(prev); n.has(id)?n.delete(id):n.add(id); return n; });

    // 등록 파기 = 그 등록에 매달린 기록 전부 파기. 맵에서 학습자 키를 걷어낸다.
    const deleteLearners = (ids) => {
      const gone = new Set(ids);
      const strip = obj => { const n={}; Object.keys(obj).forEach(k=>{ if(!gone.has(Number(k.split('_')[0]))) n[k]=obj[k]; }); return n; };
      setAttendanceMap(strip); setTsMap(strip); setScanTimeMap(strip); setReasonMap(strip);
      setCompletionMap(prev => { const n={...prev}; ids.forEach(id=>delete n[id]); return n; });
      /* ponytail: 프로토라 상수 COURSE 직접 갱신(등록 모달 정원 상향과 동일 방식).
         enrolled만 줄이고 capacity는 유지한다 — 비워진 자리는 재등록에 쓰는 자리다. */
      ids.forEach(id => {
        const l = LEARNERS_RAW.find(x => x.id === id);
        const idx = COURSE.packages.findIndex(p => p.id === l?.pkgId);
        if (idx >= 0) COURSE.packages[idx].enrolled = Math.max(0, COURSE.packages[idx].enrolled - 1);
      });
      setRemovedIds(prev => new Set([...prev, ...ids]));
      setDelSel(prev => { const n=new Set(prev); ids.forEach(id=>n.delete(id)); return n; });
      closeDelModal();
    };

    const calDaysData = useMemo(() => calDays(2026, calMonth), [calMonth]);
    const sessByDate = useMemo(() => {
      const m={};
      COURSE.packages.forEach(p=>p.sessions.forEach(s=>{
        if(!m[s.date]) m[s.date]=[];
        m[s.date].push({...s,pkgId:p.id,pkgName:p.name});
      }));
      return m;
    },[]);

    /* ══ 라이브 QR 모드 ══ */
    if (liveMode) {
      const liveTotal = todayPkg?.enrolled || 20;
      const livePresent = 7; // 시뮬레이션
      const recentScans = LEARNERS.filter(l=>l.pkgId==='p4').slice(0,3);
      return (
        <div data-feature-id="A4-02" className="h-screen bg-slate-900 flex overflow-hidden">
          <div className="flex-[7] flex flex-col items-center justify-center relative">
            <button onClick={()=>setLiveMode(false)}
              className="absolute top-6 left-6 text-white/50 hover:text-white flex items-center gap-2 text-[14px] font-bold transition-colors">
              <Minimize2 size={16}/> 라이브 모드 종료
            </button>
            <div className="text-center mb-10">
              <div className="text-[22px] font-black text-white mb-2 leading-tight">{COURSE.title}</div>
              <div className="text-[18px] font-bold text-indigo-400 mb-1">{todayPkg?.name}</div>
              <div className="text-[32px] font-black text-white">{todaySess?.name}</div>
              <div className="text-[18px] text-slate-400 mt-2">{fmtShort(todaySess?.date)} · {todaySess?.start}~{todaySess?.end} · {todayPkg?.place}</div>
              {todaySess?.capacity!=null && <div className="text-[16px] text-violet-300 font-bold mt-1">이 회차 정원 {todaySess.capacity}석</div>}

                        const yCrit = y(COMPLETION_MIN_RATE);

                        const total=done.reduce((a,s)=>a+s.att+s.late+s.el+s.abs,0);
                        return total>0?Math.round(present/total*100):null;

                                  <QrCode size={12}/> {attQrLabel}

                              )}

                            </div>
                          </div>

                          {/* 회차 테이블 */}

                                  <tr className="bg-white text-slate-400 text-[12px]">
                                    <th className="px-5 py-2.5 text-left font-bold">회차</th>
                                    <th className="px-4 py-2.5 text-left font-bold">날짜</th>
                                    <th className="px-4 py-2.5 text-left font-bold">시간</th>
                                    {courseHasSessInstr && <th className="px-4 py-2.5 text-left font-bold">강사</th>}
                                    {courseHasSessPlace && <th className="px-4 py-2.5 text-left font-bold">장소</th>}

                                    <th className="px-4 py-2.5 text-center font-bold">출석률</th>

              <div className="px-3 py-2 border-b border-slate-100 flex flex-wrap gap-1.5 shrink-0">

                  {['월','화','수','목','금','토','일'].map(d=>(
                    <div key={d} className={`text-center text-[11px] font-bold py-1 ${d==='일'?'text-rose-400':d==='토'?'text-blue-400':'text-slate-400'}`}>{d}</div>

                {/* 해당 월 세션 목록 */}
                <div className="mt-4 space-y-1.5">
                  <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wide mb-2">{calMonth}월 일정</div>
                  {COURSE.packages.flatMap(p=>p.sessions.map(s=>({...s,pkgId:p.id,pkgName:p.name,place:p.place})))
                    .filter(s=>s.date.startsWith(`2026-${String(calMonth).padStart(2,'0')}`))
                    .sort((a,b)=>b.date.localeCompare(a.date))
                    .map((s,i)=>{
                      const pkgIdx=COURSE.packages.findIndex(p=>p.id===s.pkgId);
                      const c=PKG_COLORS[pkgIdx%PKG_COLORS.length];
                      const isToday=s.date===TODAY;
                      return (
                        <div key={i} onClick={()=>setCalPopover(s)} className={`flex items-start gap-2 rounded-lg p-2.5 cursor-pointer hover:opacity-75 transition-opacity ${isToday?'bg-indigo-50 border border-indigo-200':'bg-slate-50'}`}>
                          <div className={`w-2 h-2 rounded-full ${c.dot} mt-1 shrink-0`}/>
                          <div className="flex-1 min-w-0">
                            <div className="text-[12px] font-bold text-slate-700 truncate">{s.pkgName} · {s.name}</div>
                            <div className="text-[11px] text-slate-400">{fmtShort(s.date)} {s.start}~{s.end}</div>
                          </div>
                          {isToday && <span className="text-[10px] font-black bg-indigo-500 text-white px-1.5 py-0.5 rounded-full shrink-0">오늘</span>}
                        </div>
                      );
                    })}
                  {COURSE.packages.flatMap(p=>p.sessions).filter(s=>s.date.startsWith(`2026-${String(calMonth).padStart(2,'0')}`)).length===0 && (
                    <div className="text-[13px] text-slate-400 text-center py-4">이 달에 일정이 없습니다</div>
