    { id:'A3-38', screen:'A3', screenName:'수강관리', group:'수강생관리탭', feature:'수강생 삭제 (단건)', desc:'수강생 현황 탭 맨 오른쪽 "삭제" 열(sticky right-0 — 회차가 많아 표가 가로로 밀려도 항상 보임) 휴지통 → 확인 모달. 삭제 단위는 "그 차수의 수강 등록" — 등록이 사라지면 출결·인정시각·조퇴·결석 사유·누적 학습시간·수료 판정도 함께 삭제되고 출석률·수료율·평균 학습시간·회차 집계가 재계산된다. 복구 없음. 회원 계정·다른 코스·차수 이력·차수 정원(capacity)은 유지하고 enrolled만 −1(빈 자리는 재등록에 사용). 상태 제한 없음 — 회차·차수 종료, 수료 확정 여부와 무관하게 삭제 가능(운영자가 최종 판단자). 확인 강도는 잃는 양에 비례 — 출결 0건이면 버튼 1회, 출결 있거나 수료 확정이면 삭제될 출결 N건·학습시간 N시간 고지 + "삭제" 텍스트 입력. 수료 확정자 포함 시 rose 경고("수료 기록이 함께 삭제되어 수료증 발급·법정의무교육 이수 증빙 근거가 사라집니다") + 명단에 수료 배지. 명단에는 이름과 함께 아이디 칩을 표기 — 동명이인을 이름만 보고 지우는 사고를 막는 유일한 단서', input:'행 휴지통 클릭 → (필요 시) "삭제" 입력 → 확인', output:'removedIds 추가 · attendanceMap/tsMap/scanTimeMap/reasonMap/completionMap 키 제거 · pkg.enrolled −1', note:'2026-08-06 GAP-B4 해소. 코스 삭제 정책(course-delete-policy)과 동일 스탠스(보관·복원 없음, 사전 고지 후 완전 삭제). 초안의 수료 확정자 잠금은 같은 날 철회 — 시스템이 대신 거부하면 잘못 등록된 기록을 영구히 안고 가게 된다. 막지 않고 경고한다(GAP-B6 폐기, 감사 로그는 GAP-B7 유지)', pri:'P1', phase:1, status:'todo' },

    { id:'A2-22', screen:'A2', screenName:'코스 빌더', group:'수강신청', feature:'회차선택형 ↔ 다중조합 상호배타 가드', desc:'회차선택형(sessionSelect)은 "회원이 차수 1개 선택"(single) 전용. "회원이 여러 차수 선택"(multiple)로 전환 시 회차선택형 차수를 전체일정으로 자동 전환 + 토스트 안내, 다중 상태에선 수강유형 모달의 "회차 선택형" 카드 잠금(Lock·사용 불가). 다중에서 회차 분기가 필요하면 차수를 분리해 표현', input:'신청 방식 라디오 변경', output:'sessionSelect 강제 false + 모달 카드 disabled', note:'2026-06-01 기획팀 합의(A안) + 빌더 코드 반영. 학습자단 아닌 빌더 입구에서 차단', pri:'P1', phase:1, status:'todo' },

    { id:'A2-35', screen:'A2', screenName:'코스 빌더', group:'수료 조건', feature:'퇴장 체크 스위치 (인쇄 QR 하위 설정)', desc:'출석 판정 기준 &gt; <b>인쇄 QR 라디오 카드 안</b>의 스위치다(<b>I18</b> — 종전에는 형제 행이라 어느 방식에 딸린 옵션인지 읽히지 않았다). 인쇄 QR을 고른 동안에만 보이고, 라이브에서는 대신 "라이브 QR은 퇴장 체크를 쓸 수 없습니다" 사유를 남긴다. ON이면 회차당 입장·퇴장 QR 2장 발급(08-07 I2), 종료 전 퇴장 스캔은 조퇴 판정, 미체크자는 "퇴장 미확인" 표시. 기본 OFF — 대부분 현장은 입장만 쓴다', input:'스위치 토글', output:'checkoutEnabled(boolean) — 저장값은 보존하고 라이브에서는 유효값(checkoutOn)만 죽인다', note:'2026-08-04 F4·F5·F7·F8 → 2026-08-07 I2(발급 단위 회차) → 2026-08-11 <b>I18</b>(인쇄 QR 카드 안으로 이동 · 라벨 "퇴장 체크 사용"→"퇴장 체크"). 켜면 수강생이 두 번 찍어야 하므로 퍼블리시 필요 등급', pri:'P1', phase:1, status:'todo' },

    { id:'A3-34', screen:'A3', screenName:'수강관리', group:'출석', feature:'출석 탭 진입 버튼 모드 분기', desc:'출석 방식이 진입 버튼을 정한다 — live는 [라이브 출석]/[QR 출석 시작], fixed는 [출석 QR]. 반대 경로는 비활성이 아니라 미표시. fixed는 오늘 회차가 없어도 노출한다(전날 미리 뽑는 동선)', input:'버튼 클릭', output:'liveMode=true 또는 QrModal open', note:'2026-07-28 E9 → 2026-08-04 유지. 기존 A3-04를 모드 분기로 확장', pri:'P1', phase:1, status:'todo' },
    { id:'A3-35', screen:'A3', screenName:'수강관리', group:'출석', feature:'출석 QR 모달 — 전체 차수 × 회차 목록 (라벨 PNG·SVG 다운로드 · 재발급)', desc:'모달의 단위는 <b>코스</b>다 — 전체 차수의 회차를 차수별로 묶어 보여주고, 상단 차수 필터로 한 차수만 좁힐 수 있다(<b>I16</b>). 차수 카드·캘린더에서 들어오면 그 차수로 필터된 상태로 열린다. 회차마다 QR 1장 발급 — 붙인 QR이 곧 그 회차이며 스캔 시각으로 되짚지 않는다. 퇴장 체크 ON이면 회차당 입장·퇴장 2장. 산출물은 <b>라벨+QR 합성 PNG·SVG</b>(SVG는 라벨지·A4 확대 인쇄용)이며 상단에 <b>코스명 / 회차명·입퇴장 / 학습시간·장소</b>, QR 아래에 <b>발급일</b>이 찍힌다(F9 개정 → I13). 파일명도 식별자로 유지한다(I5). 회차가 생기면 토큰은 자동 발급된다(수동 발급 단계 없음). 재발급은 명시적 버튼 + 2단 확인이며 입장·퇴장을 쌍으로 동시 교체(단위는 회차)', input:'[출석 QR] 클릭 · 차수 필터 · 회차별 PNG/SVG 다운로드 · 재발급', output:'session.qrTokenIn/qrTokenOut · {코스명}_{차수명}_{회차명}_{입장|퇴장}_{발급일}.png|svg', note:'2026-08-04 E13·D3·F5·F9·F10·F11 → 2026-08-07 I1·I2·I5·I7(발급 단위 차수→회차) → 2026-08-11 I13(장소·발급일)·<b>I16</b>(모달 단위 차수→코스, 차수 필터). 토큰은 발급 후 동결. <b>회차명·회차 시간·장소가 바뀌면 재출력 필요</b>(이미지에 값이 찍힌다) — 차수명·강사 변경은 불필요', pri:'P1', phase:1, status:'todo' },
    { id:'A3-47', screen:'A3', screenName:'수강관리', group:'출석', feature:'출석 QR 전체 다운로드 (ZIP)', desc:'QR 모달 푸터의 <b>단일 버튼</b>으로 현재 보고 있는 범위(전체 차수 또는 필터된 한 차수)의 QR을 ZIP 하나로 내려받는다(<b>I12</b> → 규격 <b>I17</b>). 구조는 <code>{코스명}_출석QR_{범위}_{날짜}/{차수명}/{회차명}_{입장|퇴장}_{발급일}.png|svg</code> — 차수별 폴더로 나뉘고 PNG·SVG가 함께 들어간다. 개별 카드의 PNG/SVG 버튼과 <b>완전히 같은 파일</b>이며 합본 이미지를 만들지 않는다(라벨로 못 쓴다). 낱개 연속 저장은 브라우저 다중 다운로드 경고에 걸리므로 쓰지 않는다. 진행 중에는 버튼이 잠기고 <code>N/M장</code>을 표시한다', input:'[전체 다운로드 (ZIP · N장)] 클릭', output:'ZIP (store, 무압축 — PNG는 이미 압축본이라 deflate 이득이 없고 외부 라이브러리를 안 쓴다)', note:'2026-08-11 I12(전 회차 일괄 다운로드로 인쇄 준비 부담 흡수) → I17(구조·범위·단일 버튼). 파일명에 발급일을 넣어 재발급 후 다시 받은 ZIP이 구버전을 덮지 않게 한다. 전 회차 일괄 <b>PDF</b>는 여전히 Out of Scope', pri:'P1', phase:1, status:'todo' },
    { id:'A3-36', screen:'A3', screenName:'수강관리', group:'출석', feature:'퇴장 미확인 표시 + 마감 시 판단', desc:'퇴장 체크 ON인데 퇴장을 찍지 않은 수강생을 "퇴장 미확인"으로 표시. 상태를 자동 변경하지 않고 관리자가 회차 마감 시 판단한다. outAt=null만으로는 "퇴장 안 쓰는 코스"와 "쓰는데 안 찍음"을 구분할 수 없어 별도 필드를 둔다', input:'-', output:'attendance[sessId].outMissing(boolean)', note:'2026-08-04 F7. 자동 출석 인정은 퇴장 체크의 목적을 없애고, 자동 조퇴 처리는 앱을 안 꺼내고 나간 사람을 벌한다. 현재 offline-view.html 미구현', pri:'P1', phase:1, status:'todo' },

    'U3-04':   '[data-feature-id="U3-04"]',    // 신청 기간 표시
    'U3-05':   '[data-feature-id="U3-05"]',    // 커리큘럼 목록
    /* user/my.html — U4 (MY학습) */
    'U4-01':   '[data-feature-id="U4-01"]',    // 진행중/완료/신청내역 탭
    'U4-02':   '[data-feature-id="U4-02"]',    // MY 코스 카드
    'U4-03':   '[data-feature-id="U4-03"]',    // 출석 내역 확인
    /* user/category.html — U7 (카테고리) */
    'U7-01':   '[data-feature-id="U7-01"]',    // 카테고리 검색
    'U7-02':   '[data-feature-id="U7-02"]',    // 코스 유형 필터
    'U7-03':   '[data-feature-id="U7-03"]',    // 카테고리 그리드 3섹션
  };

  /* ══ 사이드바 메뉴 — online-list.html과 동일 구조 (오프라인/온라인 코스는 코스v2 children으로 흡수) ══ */

    { id: 'member', label: '회원', icon: Users, hasChildren: true },
    { id: 'course', label: '코스', icon: BookOpen, hasChildren: true, children: [
      { id: 'course-main', label: '코스' },
      { id: 'course-plus', label: 'PLUS 코스' },
    ]},
    /* 오프라인/온라인 코스는 '코스v2' children으로 이동 (NEW_MENUS 참조) */
    { id: 'content', label: '콘텐츠', icon: Copy, hasChildren: true },
    { id: 'ttube', label: 'T튜브', icon: Monitor, hasChildren: true },
    { id: 'ai-quiz', label: 'AI 퀴메이커', icon: Star, badge: 'N' },
    { id: 'translation', label: 'Translation', icon: List, hasChildren: true },
    { id: 'question-bank', label: '문제 은행', icon: Archive },
    { id: 'opinion', label: '의견', icon: AlertCircle },
    { id: 'gamification', label: '게이미피케이션', icon: Grid3X3, hasChildren: true },

    { id: 'touch', label: '터치투게더', icon: Users },
    { id: 'attendance', label: '출석 체크', icon: CheckCircle },
    { id: 'ai-chat', label: 'AI 챗봇', icon: Monitor, badge: 'N' },
    { id: 'stats', label: '통계', icon: Filter },
    { id: 'notice', label: '공지사항', icon: Archive },
    { id: 'popup', label: '팝업', icon: Layers },
  ];

  /* ══ App ══ */
  const App = () => {
    const isEmbed = new URLSearchParams(window.location.search).get('embed') === '1';
    const [sideExpanded, setSideExpanded] = useState(new Set(['course']));
    const toggleSideMenu = (id) => setSideExpanded(prev => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });
    const [side, setSide] = useState('admin'); // 'admin' | 'user'
    const [filterPhase, setFilterPhase] = useState('all');
    const [filterPri, setFilterPri] = useState('all');
    const [filterStatus, setFilterStatus] = useState('all');
    const [filterScreen, setFilterScreen] = useState('all');
    const [search, setSearch] = useState('');
    /* 우측 슬라이드 패널: 프로토타입 미리보기 */
    const [previewScreen, setPreviewScreen] = useState(null); // {screen, label, url, selector?, featureId?, featureName?}
    const [previewFullscreen, setPreviewFullscreen] = useState(false);
    const iframeRef = useRef(null);
    const iframeLoadedUrlRef = useRef(null);

    /* previewScreen 변경 시 iframe이 같은 URL이면 즉시 하이라이트 갱신 */
    useEffect(() => {
      if (!previewScreen || !iframeRef.current) return;
      const currentUrl = previewScreen.url;
      if (iframeLoadedUrlRef.current === currentUrl) {
        /* 같은 페이지면 즉시 postMessage */
        try {
          iframeRef.current.contentWindow.postMessage({
            type: 'feature-highlight',
            selector: previewScreen.selector || null,
            featureId: previewScreen.featureId,
            featureName: previewScreen.featureName,
          }, '*');
        } catch (err) { console.warn('postMessage 실패', err); }
      }
      /* 다른 URL이면 onLoad에서 처리됨 */
    }, [previewScreen]);

    const rows = side === 'admin' ? ADMIN_ROWS : USER_ROWS;

    const screens = useMemo(() => {
      const seen = new Set();
      return rows.filter(r => { if(seen.has(r.screen)) return false; seen.add(r.screen); return true; })
        .map(r => ({ id: r.screen, name: r.screenName }));
    }, [rows]);

    const filtered = useMemo(() => {
      let list = rows;
      if(filterPhase !== 'all') list = list.filter(r => r.phase === Number(filterPhase));
      if(filterPri !== 'all') list = list.filter(r => r.pri === filterPri);
      if(filterStatus !== 'all') list = list.filter(r => r.status === filterStatus);
      if(filterScreen !== 'all') list = list.filter(r => r.screen === filterScreen);
      if(search.trim()) {
        const q = search.toLowerCase();
        list = list.filter(r => r.feature.includes(search) || r.desc.toLowerCase().includes(q) || r.group.includes(search));
      }
      return list;
    }, [rows, filterPhase, filterPri, filterStatus, filterScreen, search]);

    /* 집계 */
    const stats = useMemo(() => ({
      total:  rows.length,
      done:   rows.filter(r=>r.status==='done').length,
      wip:    rows.filter(r=>r.status==='wip').length,
      todo:   rows.filter(r=>r.status==='todo').length,
      p1:     rows.filter(r=>r.phase===1).length,
      p2:     rows.filter(r=>r.phase===2).length,
      p3:     rows.filter(r=>r.phase===3).length,
      p4:     rows.filter(r=>r.phase===4).length,
    }), [rows]);

    /* 행 그룹핑 — 화면 변경 시 구분선 */
    let lastScreen = null;

      <div className="min-h-screen flex">

        {/* 글로벌 좌측 사이드바 — 2026-05-07 제거 (기능명세서는 어드민 레이아웃과 무관한 단독 페이지) */}

        {/* ══ 메인 영역 ══ */}
        <div className="flex-1 flex flex-col min-h-screen bg-[#f2f5f9]">

          {/* 글로벌 탑 네비게이션 — 2026-05-07 제거 (기능명세서 단독 페이지에서 불필요한 chrome) */}

          {/* 페이지 서브 헤더 */}
          {!isEmbed && (
            <header className="shrink-0 px-6 py-3.5 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <FileSpreadsheet size={18} className="text-indigo-500"/>

                <span className="text-[11px] font-bold text-slate-400">오프라인 코스 시스템 v1.9</span>
                <span className="text-[10px] font-black text-violet-700 bg-violet-100 border border-violet-300 px-2 py-0.5 rounded-full ml-1">📍 기능 라인 SSOT</span>
              </div>
              <div className="flex items-center gap-2">
                <span className="text-[12px] text-slate-400 font-medium">기준일: 2026-08-05</span>
              </div>
            </header>

          <div className="flex flex-1 overflow-hidden gap-3 px-4 pb-4 pt-0 items-start">

          {/* 왼쪽: 관리자/사용자 탭 + 필터 */}
          <aside className="w-[200px] bg-white rounded-xl shadow-card flex flex-col shrink-0 overflow-hidden">

            {/* 관리자단 / 사용자단 탭 */}

                <Shield size={14}/> 관리자단
                <span className={`ml-auto text-[10px] font-black px-1.5 py-0.5 rounded-full ${side==='admin'?'bg-white/20 text-white':'bg-slate-100 text-slate-500'}`}>{ADMIN_ROWS.length}</span>
              </button>
              <button onClick={()=>{setSide('user');setFilterScreen('all');setFilterPhase('all');}}
                className={`w-full flex items-center gap-2 px-3 py-2.5 rounded-xl text-[13px] font-bold transition-colors
                  ${side==='user'?'bg-emerald-500 text-white shadow-sm':'text-slate-600 hover:bg-slate-50'}`}>
                <User size={14}/> 사용자단
                <span className={`ml-auto text-[10px] font-black px-1.5 py-0.5 rounded-full ${side==='user'?'bg-white/20 text-white':'bg-slate-100 text-slate-500'}`}>{USER_ROWS.length}</span>
              </button>
            </div>

            {/* 화면 필터 */}
            <div className="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-1">
              <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wide px-1 mb-2">화면 선택</div>

                  <span className={`text-[10px] font-black px-1.5 py-0.5 rounded-md ${SCREEN_COLORS[s.id]}`}>{s.id}</span>

                  {val:'3',   label:`Phase 3 (${rows.filter(r=>r.phase===3).length})`},
                  {val:'4',   label:`Phase 4 (${rows.filter(r=>r.phase===4).length})`},

                  <button key={val} onClick={()=>{setFilterPhase(val);setFilterScreen('all');}}

                    {val==='2' && <span className="w-1.5 h-1.5 rounded-full bg-violet-400 shrink-0"/>}

                    {s==='all'?'전체':<><span className={`w-1.5 h-1.5 rounded-full ${ST[s]?.dot.replace('animate-pulse','')}`}/>{ST[s]?.label}</>}

            <div className="flex-1 overflow-auto custom-scrollbar">

                    <th className="px-3 py-3 text-left w-[70px]">구분</th>

                    <th className="px-3 py-3 text-center w-[60px]">화면</th>
                  </tr>

                  {filtered.map((row, idx) => {
                    const isNewScreen = row.screen !== lastScreen;

                    const pri = PRI[row.pri];
                    const st = ST[row.status];
                    const isEven = idx % 2 === 0;
                    return (
                      <React.Fragment key={row.id}>
                        {isNewScreen && (
                          <tr>
                            <td colSpan={13} className="bg-slate-100 border-t-2 border-slate-300 px-3 py-1.5" style={{position:'relative',zIndex:1}}>
                              <div className="flex items-center gap-2">

                                <span className="text-[12px] font-black text-slate-700">{row.screenName}</span>
                                <span className="text-[11px] text-slate-400 font-medium">— {filtered.filter(r=>r.screen===row.screen).length}개 기능</span>

                        )}

          </div>
        </div>

        {/* ══ 우측 슬라이드 패널: 프로토타입 미리보기 ══ */}
        {previewScreen && (
          <>
            {/* 백드롭 — 전체 영역 클릭 시 닫기 (전체화면 모드는 진하게, 일반 모드는 살짝 투명) */}
            <div
              onClick={() => { setPreviewScreen(null); setPreviewFullscreen(false); iframeLoadedUrlRef.current = null; }}
              className="fixed inset-0 z-40 cursor-pointer"
              style={{
                background: previewFullscreen ? 'rgba(0,0,0,0.4)' : 'rgba(15,23,42,0.08)',
                transition: 'background .2s'
              }}
              title="클릭해서 닫기"
            />
            {/* 슬라이드 패널 */}
            <aside
              className="fixed top-0 right-0 h-full bg-white border-l border-slate-200 shadow-2xl z-50 flex flex-col transition-[width] duration-300"
              style={(() => {
                const isUserScreen = previewScreen.screen && previewScreen.screen.startsWith('U');
                if (previewFullscreen) {
                  return { width: '100vw', minWidth: 'auto', animation: 'slideInRight .25s ease-out' };
                }
                if (isUserScreen) {
                  /* 사용자단 — 모바일 프레임(390px) + 좌우 여백 */
                  return { width: 'min(35vw, 520px)', minWidth: '440px', animation: 'slideInRight .25s ease-out' };
                }
                /* 관리자단 — 데스크탑 풀폭 */
                return { width: 'calc(100vw - 480px)', minWidth: '600px', animation: 'slideInRight .25s ease-out' };
              })()}
            >
              {/* 패널 헤더 */}
              <div className="shrink-0 px-5 py-3 border-b border-slate-200 bg-slate-50 flex items-center justify-between gap-3">
                <div className="flex items-center gap-2 min-w-0">
                  <span className={`text-[10px] font-black px-2 py-0.5 rounded-md shrink-0 ${SCREEN_COLORS[previewScreen.screen]}`}>{previewScreen.screen}</span>
                  <Monitor size={14} className="text-indigo-500 shrink-0"/>
                  <span className="text-[14px] font-black text-slate-800 truncate">{previewScreen.label}</span>
                </div>
                <div className="flex items-center gap-1 shrink-0">
                  <button
                    onClick={() => setPreviewFullscreen(v => !v)}
                    title={previewFullscreen ? '축소 (75% 너비)' : '전체화면 (100% 너비)'}
                    className={`px-2.5 h-8 inline-flex items-center gap-1 rounded-md text-[11px] font-bold transition-colors ${previewFullscreen ? 'bg-indigo-500 text-white hover:bg-indigo-600' : 'text-slate-500 hover:bg-white hover:text-indigo-600 border border-slate-200'}`}>
                    {previewFullscreen ? <><span style={{transform:'rotate(180deg)'}}>⛶</span> 축소</> : <>⛶ 전체화면</>}
                  </button>
                  <a
                    href={previewScreen.url}
                    target="_blank"
                    rel="noopener"
                    title="새 창으로 열기"
                    className="w-8 h-8 inline-flex items-center justify-center rounded-md text-slate-500 hover:bg-white hover:text-indigo-600 transition-colors border border-slate-200">
                    <Eye size={15}/>
                  </a>
                  <button
                    onClick={() => { setPreviewScreen(null); setPreviewFullscreen(false); iframeLoadedUrlRef.current = null; }}
                    title="닫기 (Esc)"
                    className="w-8 h-8 inline-flex items-center justify-center rounded-md text-slate-500 hover:bg-white hover:text-rose-600 transition-colors text-[18px] font-bold border border-slate-200">
                    ×
                  </button>
                </div>
              </div>
              {/* iframe — 로드 후 postMessage로 selector 하이라이트 요청 */}
              <iframe
                ref={iframeRef}
                src={previewScreen.url}
                title={previewScreen.label}
                className="flex-1 w-full border-0 bg-white"
                onLoad={(e) => {
                  iframeLoadedUrlRef.current = previewScreen.url;
                  if (previewScreen.selector) {
                    try {
                      e.target.contentWindow.postMessage({
                        type: 'feature-highlight',
                        selector: previewScreen.selector,
                        featureId: previewScreen.featureId,
                        featureName: previewScreen.featureName,
                      }, '*');
                    } catch (err) { console.warn('postMessage 실패', err); }
                  }
                }}
              />
              {previewScreen.selector && (
                <div className="shrink-0 px-4 py-1.5 bg-indigo-50 border-t border-indigo-200 text-[11px] text-indigo-700 flex items-center gap-2">
                  <span className="font-bold">📍 위치 하이라이트</span>
                  <span className="text-indigo-500">— 화면에서 [{previewScreen.featureName}] 위치 찾으면 툴팁 표시. 5초 후 자동 사라짐 / 클릭·Esc로 닫기</span>
                </div>
              )}
              {/* 패널 푸터 */}
              <div className="shrink-0 px-4 py-2 bg-slate-50 border-t border-slate-200 text-[11px] text-slate-500 flex items-center justify-between">
                <span>📍 admin/<strong>{previewScreen.url}</strong> {previewFullscreen && <span className="ml-2 text-indigo-600 font-bold">· 전체화면 모드</span>}</span>
                <span className="text-slate-400">기능명 클릭 / 좌측 영역 클릭으로 닫기 / × 또는 ⛶ 전체화면</span>
              </div>
            </aside>
            <style>{`
              @keyframes slideInRight {
                from { transform: translateX(100%); opacity: 0; }
                to   { transform: translateX(0); opacity: 1; }
              }
            `}</style>
          </>
        )}
      </div>
    );
  };

  createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
